openapi: 3.2.0
info:
  title: Canva User API
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  termsOfService: https://www.canva.com/trust/legal/
  version: '1.0'
  description: 'Operations tagged user across 2 of this provider''s published API definitions: canva-admin-openapi.yml, canva-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Admin API
  url: https://api.canva.com/admin
- description: Canva REST APIs
  url: https://api.canva.com/rest
tags:
- name: User
paths:
  /v1/users:
    get:
      description: Lists users.
      operationId: listUsers
      parameters:
      - deprecated: true
        description: 'Filters the response using the email address of a user. This must match a user''s email exactly.


          **Deprecated:** Use the [Find user API](https://www.canva.dev/docs/admin/api-reference/users/find-user/) (`POST /v1/users/find`) instead, which accepts the email address in the request body.'
        explode: true
        in: query
        name: email
        required: false
        schema:
          format: email
          maxLength: 254
          minLength: 1
          type: string
        style: form
      - description: 'If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.


          To retrieve all items, you might need to make multiple requests.'
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of users to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                continuation_not_supported_for_email:
                  $ref: '#/components/examples/ContinuationNotSupportedForEmailError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:read
      tags:
      - User
      summary: List users
      x-summary-source: derived
    post:
      description: 'Creates a managed user in the caller''s organization. The request must meet the following requirements:


        - The email domain must be a verified domain owned by the caller''s organization.

        - The SAML identity provider, resolved using the provided `idp_issuer` value, must belong to that organization.


        If the email address already belongs to an existing Canva account that isn''t part of an organization, that account is brought into the organization instead of a new one being created, and the person might be asked to confirm this. Any existing properties for that user aren''t updated with the values provided in the request.


        If successful, the response contains the user''s Canva ID, email address, display name, first name, last name, SAML account (if any), and organization role.'
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                invalid_display_name:
                  $ref: '#/components/examples/InvalidDisplayNameError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '403':
          content:
            application/json:
              examples:
                idp_not_authorized:
                  $ref: '#/components/examples/IdpNotAuthorizedError'
                invalid_email_domain:
                  $ref: '#/components/examples/InvalidEmailDomainError'
                team_at_max_capacity:
                  $ref: '#/components/examples/TeamAtMaxCapacityError'
                user_in_max_teams:
                  $ref: '#/components/examples/UserInMaxTeamsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '409':
          content:
            application/json:
              examples:
                user_not_active:
                  $ref: '#/components/examples/UserNotActiveError'
                user_pending_consent:
                  $ref: '#/components/examples/UserPendingConsentError'
                saml_name_id_not_available:
                  $ref: '#/components/examples/SamlNameIdNotAvailableError'
                account_exists:
                  $ref: '#/components/examples/AccountExistsError'
                user_email_unverified:
                  $ref: '#/components/examples/UserEmailUnverifiedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:write
        - admin:team:write
      tags:
      - User
      summary: Create user
      x-summary-source: derived
    servers:
    - description: Admin API
      url: https://api.canva.com/admin
  /v1/users/find:
    post:
      description: 'Finds a user in the caller''s organization by exact email.


        The email address is restricted data and is accepted only in the JSON request body. The

        response contains zero or one user.'
      operationId: findUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindUserRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                found:
                  summary: Found user
                  value:
                    user:
                      id: UAAAAAAAAA1
                      display_name: Joe Smith
                      email: joe@acme.com
                      first_name: Joe
                      last_name: Smith
                      last_active_at: 1750300000
                      locale: en
                      role: admin
                no_match:
                  summary: No matching user found
                  value: {}
              schema:
                $ref: '#/components/schemas/FindUserResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:read
      tags:
      - User
      summary: Find user
      x-summary-source: derived
    servers:
    - description: Admin API
      url: https://api.canva.com/admin
  /v1/users/{userId}:
    get:
      description: Gets a user.
      operationId: getUser
      parameters:
      - description: The user ID.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: '#/components/examples/UserNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:read
      tags:
      - User
      summary: Get user
      x-summary-source: derived
    patch:
      description: 'Updates a user that is already managed by the caller''s organization. Only the fields provided in the request are updated, and any omitted fields are left unchanged.


        The `name` object fields (`display_name`, `first_name`, and `last_name`) must be updated together. To clear a first or last name, set it to an empty string. Blank first and last names are allowed.'
      operationId: updateUser
      parameters:
      - description: The user ID.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                invalid_display_name:
                  $ref: '#/components/examples/InvalidDisplayNameError'
                invalid_locale:
                  $ref: '#/components/examples/InvalidLocaleError'
                user_not_managed:
                  $ref: '#/components/examples/UserNotManagedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '403':
          content:
            application/json:
              examples:
                idp_not_authorized:
                  $ref: '#/components/examples/IdpNotAuthorizedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '409':
          content:
            application/json:
              examples:
                user_linked_to_another_idp:
                  $ref: '#/components/examples/UserLinkedToAnotherIdpError'
                saml_name_id_not_available:
                  $ref: '#/components/examples/SamlNameIdNotAvailableError'
                user_pending_consent:
                  $ref: '#/components/examples/UserPendingConsentError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:write
      tags:
      - User
      summary: Update user
      x-summary-source: derived
    servers:
    - description: Admin API
      url: https://api.canva.com/admin
  /v1/users/me:
    get:
      description: 'Returns the User ID and Team ID of the user

        account associated with the provided access token.'
      operationId: usersMe
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode: []
      tags:
      - User
      x-rate-limit-per-client-user: 10
      summary: Users me
      x-summary-source: derived
    servers:
    - description: Canva REST APIs
      url: https://api.canva.com/rest
  /v1/users/me/capabilities:
    get:
      description: Lists the API capabilities for the user account associated with the provided access token. For more information, see Capabilities.
      operationId: getUserCapabilities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserCapabilitiesResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - profile:read
      tags:
      - User
      x-rate-limit-per-client-user: 10
      summary: Get user capabilities
      x-summary-source: derived
    servers:
    - description: Canva REST APIs
      url: https://api.canva.com/rest
  /v1/users/me/profile:
    get:
      description: Currently, this returns the display name of the user account associated with the provided access token. More user information is expected to be included in the future.
      operationId: getUserProfile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: '#/components/examples/UserNotFoundError_2'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - profile:read
      tags:
      - User
      x-rate-limit-per-client-user: 10
      summary: Get user profile
      x-summary-source: derived
    servers:
    - description: Canva REST APIs
      url: https://api.canva.com/rest
components:
  examples:
    UserNotActiveError:
      summary: The user matching the email is not active
      value:
        code: user_not_active
        message: The existing user matching this email is not active and can't be added.
    IdpNotAuthorizedError:
      summary: The SAML identity provider is not owned by the caller's organization (or doesn't exist)
      value:
        code: permission_denied
        message: The identity provider is not owned by your organization.
    UserNotManagedError:
      summary: The user is not managed by the organization
      value:
        code: user_not_managed
        message: User {userId} is not managed by the organization
    UserEmailUnverifiedError:
      summary: The existing account's email is not verified
      value:
        code: user_email_unverified
        message: The existing account for this email hasn't verified its email address, so it can't be linked to your organization.
    InvalidLocaleError:
      summary: The locale is not a supported language
      value:
        code: invalid_field
        message: The locale {locale} is not a supported language.
    SamlNameIdNotAvailableError:
      summary: The SAML name ID is already in use
      value:
        code: saml_name_id_not_available
        message: The SAML name ID {nameId} is already associated with another user.
    InvalidDisplayNameError:
      summary: The display name is not allowed
      value:
        code: invalid_field
        message: The supplied display_name is not allowed.
    ContinuationNotSupportedForEmailError:
      summary: Continuation is not supported for listing users by email
      value:
        code: bad_query_params
        message: Continuation is not supported for listing users by email.
    UserLinkedToAnotherIdpError:
      summary: The user is already linked to a different SAML identity provider
      value:
        code: user_linked_to_another_idp
        message: User {userId} already has a SAML account linked to a different identity provider.
    UserInMaxTeamsError:
      summary: The user has reached the maximum number of teams
      value:
        code: max_limit_reached
        message: User {userId} has reached the maximum number of teams
    UserPendingConsentError:
      summary: The user is awaiting consent from a previous request
      value:
        code: user_pending_consent
        message: A previous request for this user is awaiting their consent. Wait for them to accept before retrying.
    UserNotFoundError:
      summary: The user was not found
      value:
        code: user_not_found
        message: User {userId} not found
    AccountExistsError:
      summary: An account already exists for this email
      value:
        code: account_exists
        message: That email address is already associated with a Canva account.
    InvalidEmailDomainError:
      summary: The email domain is not a verified domain owned by the caller's organization
      value:
        code: permission_denied
        message: The email domain is not in your organization's verified domains.
    TeamAtMaxCapacityError:
      summary: A target team has reached its maximum member capacity
      value:
        code: max_limit_reached
        message: One or more provided teams have reached its maximum member capacity
    UserNotFoundError_2:
      summary: The user was not found.
      value:
        code: user_not_found
        message: User not found
  schemas:
    TeamMemberRole:
      description: The role of the member in the team.
      enum:
      - admin
      - designer
      - member
      type: string
    FindUserRequest:
      example:
        email: drsmith@brightsmiledental.com
      properties:
        email:
          description: The email address of the user to find.
          example: drsmith@brightsmiledental.com
          format: email
          maxLength: 254
          minLength: 1
          type: string
      required:
      - email
      type: object
    UpdateUserResponse:
      description: Successful response from an updateUser request.
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
      type: object
    OrganizationMemberRole:
      description: The role of the user in the organization.
      enum:
      - admin
      - brand_designer
      - member
      type: string
    SamlAccount:
      description: The SAML account details used to link the user to the organization's identity provider for SSO.
      properties:
        idp_issuer:
          description: The issuer id or entity id of the SAML identity provider. Often a unique URL, but not always. Must resolve to an identity provider owned by the caller's organization.
          example: https://sso.acme.com/saml/metadata
          minLength: 1
          type: string
        name_id:
          description: The SAML NameID that identifies the user to the identity provider. This value is case sensitive, and shouldn't change.
          example: joe.smith@acme.com
          minLength: 1
          type: string
      required:
      - idp_issuer
      - name_id
      type: object
    CreateUserResponse:
      description: Successful response from a `createUser` request.
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
      type: object
    CreateUserRequest:
      description: Parameters for creating a managed user in the organization.
      example:
        email: joe@acme.com
        display_name: Joe Smith
        first_name: Joe
        last_name: Smith
        locale: en
        saml_account:
          idp_issuer: https://sso.acme.com/saml/metadata
          name_id: joe.smith@acme.com
        team_memberships:
        - team_id: BAAAAAAAAA1
          role: member
      properties:
        email:
          description: 'The email address of the user. The email domain must be a verified domain owned by the

            caller''s organization.'
          example: joe@acme.com
          format: email
          maxLength: 254
          minLength: 1
          type: string
        display_name:
          description: The display name of the user.
          example: Joe Smith
          minLength: 1
          type: string
        first_name:
          description: The first name of the user.
          example: Joe
          type: string
        last_name:
          description: The last name of the user.
          example: Smith
          type: string
        locale:
          default: en
          description: The locale of the user, as an IETF BCP 47 language tag. Must be a supported language. Defaults to `en` if not provided.
          example: en
          type: string
        saml_account:
          $ref: '#/components/schemas/SamlAccount'
        team_memberships:
          description: The teams the user is added to. At least one team membership is required so that the user is visible in the [Get user](https://www.canva.dev/docs/admin/api-reference/users/get-user/) and [List users](https://www.canva.dev/docs/admin/api-reference/users/list-users/) API responses.
          items:
            $ref: '#/components/schemas/TeamMembership'
          minItems: 1
          type: array
      required:
      - display_name
      - email
      - saml_account
      - team_memberships
      type: object
    User:
      description: A user.
      example:
        id: UAAAAAAAAA1
        display_name: Joe Smith
        email: joe@acme.com
        first_name: Joe
        last_name: Smith
        last_active_at: 1750300000
        locale: en
        role: admin
      properties:
        id:
          description: The user ID.
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        display_name:
          description: The display name of the user.
          type: string
        email:
          description: The email address of the user.
          format: email
          type: string
        first_name:
          description: The first name of the user.
          type: string
        last_name:
          description: The last name of the user.
          type: string
        last_active_at:
          description: When the user was last active, as a Unix timestamp (in seconds since the Unix Epoch).
          format: int64
          type: integer
        locale:
          description: The locale of the user, as an IETF BCP 47 language tag.
          example: en
          type: string
        role:
          $ref: '#/components/schemas/OrganizationMemberRole'
        saml_account:
          $ref: '#/components/schemas/SamlAccount'
      required:
      - id
      type: object
    ErrorCode:
      description: 'A short string indicating what failed. This field can be used to handle errors programmatically.

        '
      enum:
      - permission_denied
      - too_many_requests
      - max_limit_reached
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - endpoint_not_found
      - invalid_access_token
      - missing_scope
      - invalid_field
      - input_unsafe
      - display_name_unavailable
      - team_not_found
      - group_not_found
      - team_is_default
      - user_not_found
      - saml_team_id_conflict
      - user_not_managed
      - saml_name_id_not_available
      - user_linked_to_another_idp
      - user_email_unverified
      - user_not_active
      - user_pending_consent
      - account_exists
      - domain_restricted
      - user_already_member
      type: string
    UpdateUserRequest:
      description: 'Updates to be made to a user. Only the fields provided in the request are updated.


        To update the user''s name, provide the `name` object with `display_name`, `first_name`, and `last_name`.


        To update the user''s SAML name ID, provide the `saml_account` object with both `idp_issuer` and `name_id`. The `idp_issuer` must match the user''s current identity provider (it acts as a guard and can''t be changed with this API, so only `name_id` is updated).'
      properties:
        name:
          $ref: '#/components/schemas/UserNameUpdate'
        locale:
          description: The locale of the user, as an IETF BCP 47 language tag. Must be a supported language.
          example: en-GB
          type: string
        saml_account:
          $ref: '#/components/schemas/SamlAccount'
      type: object
    ListUsersResponse:
      description: Successful response from a `listUsers` request.
      properties:
        continuation:
          description: 'If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.


            To retrieve all items, you might need to make multiple requests.'
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
        items:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
      - items
      type: object
    GetUserResponse:
      description: Successful response from a `getUser` request
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
      type: object
    TeamMembership:
      description: A team to add the user to on creation, with the user's role in that team.
      properties:
        team_id:
          description: The team ID.
          example: BAAAAAAAAA1
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      - team_id
      type: object
    FindUserResponse:
      description: Successful response from a `findUser` request
      example:
        user:
          id: UAAAAAAAAA1
          email: drsmith@brightsmiledental.com
      properties:
        user:
          $ref: '#/components/schemas/User'
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    UserNameUpdate:
      description: The name fields to update for the user.
      properties:
        display_name:
          description: The display name of the user.
          example: Joe Smith
          minLength: 1
          type: string
        first_name:
          description: The first name of the user. Set to an empty string to clear the first name.
          example: Joe
          type: string
        last_name:
          description: The last name of the user. Set to an empty string to clear the last name.
          example: Smith
          type: string
      required:
      - display_name
      - first_name
      - last_name
      type: object
    Capability:
      description: 'Some APIs are annotated with required capabilities. These endpoints require the user to

        possess the required capabilities in order to be called successfully.'
      enum:
      - analytics
      - autofill
      - background_removal
      - brand_template
      - design_generation
      - export_png_transparency
      - image_to_design_imports
      - resize
      - team_restricted_app
      type: string
      x-enum-descriptions:
      - Capability required to call the Design analytics APIs. Users that are members of a [Canva Enterprise](https://www.canva.com/enterprise/) organization have this capability.
      - Capability required to call autofill APIs. Users on a Canva plan with access to autofill (such as Canva Pro, Canva Teams, or Canva Enterprise) have this capability.
      - Capability required to apply the `background_removal` transformation using the Image transformation APIs. Users on a Canva plan with premium features (such as Canva Pro) have this capability.
      - Capability required to use brand template APIs. Users on a Canva plan with access to brand templates (such as Canva Pro, Canva Teams, or Canva Enterprise) have this capability.
      - Capability required to call the Design Generation APIs. Users whose feature eligibility and team permissions allow design generation have this capability.
      - Capability required to export designs in PNG with a transparent background. Users on a paid Canva plan (such as Canva Pro) have this capability.
      - Capability required to call the Image to Design Import APIs. Users whose [team permission settings](https://www.canva.com/en_au/help/setting-up-team-permissions/) allow "[Magic Layers](https://www.canva.com/magic-layers/)" have this capability.
      - Capability required to create design resize jobs. Users on a Canva plan with premium features (such as Canva Pro) have this capability.
      - Capability required to create a team-restricted app. Users that are members of the [Canva Enterprise](https://www.canva.com/enterprise/) or the [Canva for Education](https://www.canva.com/education/) organization have this capability.
    GetUserCapabilitiesResponse:
