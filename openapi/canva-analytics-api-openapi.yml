    Viewer:
      description: A viewer and their engagement metrics for the design.
      properties:
        viewer_id:
          description: An opaque identifier for the viewer. Use this value when filtering page view results by viewer.
          example: b2d44753-f996-46ff-8f01-d4143911550f
          type: string
        user:
          allOf:
          - $ref: '#/components/schemas/TeamUser'
          description: The user details of the viewer. This is omitted for viewers whose identity is not visible.
        last_viewed_at:
          description: When the viewer most recently opened the design, as a Unix timestamp (in seconds since the Unix Epoch).
          example: 1748044800
          format: int64
          type: integer
        viewer_type:
          $ref: '#/components/schemas/DesignAnalyticsViewerType'
        visibility:
          $ref: '#/components/schemas/DesignAnalyticsViewerVisibility'
        total_view_duration_seconds:
          description: The total time this viewer has spent viewing the design, in seconds.
          example: 312
          format: int64
          type: integer
        first_viewed_at:
          description: When the viewer first viewed the design, as a Unix timestamp (in seconds since the Unix Epoch).
          example: 1745452800
          format: int64
          type: integer
        pages_viewed:
          description: The number of pages this viewer viewed for more than one second.
          example: 8
          format: int64
          type: integer
        form_factor:
          $ref: '#/components/schemas/DesignAnalyticsViewerFormFactor'
        device_operating_system:
          description: The simplified operating system name for the viewer's device.
          example: macOS
          type: string
        city_country:
          description: The viewer location as city and country. This is only returned for anonymous viewers.
          example: Sydney, Australia
          type: string
        total_view_count:
          description: The number of times this viewer opened the design.
          example: 14
          format: int64
          type: integer
      required:
      - last_viewed_at
      - viewer_id
      - viewer_type
      - visibility
      type: object
    GetDesignAnalyticsViewersResponse:
