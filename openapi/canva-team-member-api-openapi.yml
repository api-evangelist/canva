openapi: 3.2.0
info:
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  description: REST API for building admin integrations with Canva
  license:
    name: ©2025 All Rights Reserved
  termsOfService: https://www.canva.com/trust/legal/
  title: Canva Admin Team Member API
  version: 2026-08-18
servers:
- description: Admin API
  url: https://api.canva.com/admin
tags:
- name: Team Member
paths:
  /v1/users/{userId}/team-memberships:
    get:
      description: 'Lists the team memberships of a user across all teams in the caller''s organization.


        Use this endpoint to discover which teams a user belongs to without having to enumerate teams and list their members individually. The response contains a `TeamMember` for each team the user is a member of, including the user''s role in that team.


        Access semantics match the Get user API. The API returns a `404` if the user is not in the caller''s organization, regardless of whether the user is managed by the caller''s organization.'
      operationId: listUserTeamMemberships
      parameters:
      - description: The user ID.
        example: UAAAAAAAAA1
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserTeamMembershipsResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: '#/components/examples/UserNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:read
      tags:
      - Team Member
      summary: List user team memberships
      x-summary-source: derived
  /v1/teams/{teamId}/members:
    get:
      description: Lists members in a team.
      operationId: listTeamMembers
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: 'If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.


          To retrieve all items, you might need to make multiple requests.'
        example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of members to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTeamMembersResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:read
      tags:
      - Team Member
      summary: List team members
      x-summary-source: derived
    post:
      description: Adds a user to a team. The user must be managed by the organization that owns the team.
      operationId: createTeamMember
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamMemberRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeamMemberResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                user_not_managed:
                  $ref: '#/components/examples/UserNotManagedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '403':
          content:
            application/json:
              examples:
                sso_required:
                  $ref: '#/components/examples/SsoRequiredError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                user_not_found:
                  $ref: '#/components/examples/UserNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:write
      tags:
      - Team Member
      summary: Create team member
      x-summary-source: derived
  /v1/teams/{teamId}/members/{userId}:
    delete:
      description: Removes a user from a team. The user must exist and be a member of the team.
      operationId: deleteTeamMember
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: The user ID.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '204':
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                team_member_not_found:
                  $ref: '#/components/examples/TeamMemberNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:write
      tags:
      - Team Member
      summary: Delete team member
      x-summary-source: derived
    get:
      description: Gets a team member.
      operationId: getTeamMember
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: The user ID.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTeamMemberResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                team_member_not_found:
                  $ref: '#/components/examples/TeamMemberNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:read
      tags:
      - Team Member
      summary: Get team member
      x-summary-source: derived
    patch:
      description: Updates a member of a team. Currently, you can only update the member's role in the team.
      operationId: updateTeamMember
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: The user ID.
        example: UAAAAAAAAA1
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTeamMemberResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                team_member_not_found:
                  $ref: '#/components/examples/TeamMemberNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:write
      tags:
      - Team Member
      summary: Update team member
      x-summary-source: derived
components:
  schemas:
    GetTeamMemberResponse:
      description: Successful response from a `getTeamMember` request
      properties:
        team_member:
          $ref: '#/components/schemas/TeamMember'
      required:
      - team_member
      type: object
    CreateTeamMemberResponse:
      description: Successful response from a `createTeamMember` request
      properties:
        team_member:
          $ref: '#/components/schemas/TeamMember'
      required:
      - team_member
      type: object
    ListUserTeamMembershipsResponse:
      description: 'Successful response from a `listUserTeamMemberships` request.


        Contains every team membership for the user within the caller''s organization. This list is

        not paginated: a user can belong to at most 100 teams in total, so all memberships are

        always returned in a single response.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamMember'
          type: array
      required:
      - items
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    CreateTeamMemberRequest:
      properties:
        user_id:
          description: The user ID.
          example: UAAAAAAAAA1
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      - user_id
      type: object
    TeamMemberRole:
      description: The role of the member in the team.
      enum:
      - admin
      - designer
      - member
      type: string
    ErrorCode:
      description: 'A short string indicating what failed. This field can be used to handle errors programmatically.

        '
      enum:
      - permission_denied
      - too_many_requests
      - max_limit_reached
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - endpoint_not_found
      - invalid_access_token
      - missing_scope
      - invalid_field
      - input_unsafe
      - display_name_unavailable
      - team_not_found
      - group_not_found
      - team_is_default
      - user_not_found
      - saml_team_id_conflict
      - user_not_managed
      - saml_name_id_not_available
      - user_linked_to_another_idp
      - user_email_unverified
      - user_not_active
      - user_pending_consent
      - account_exists
      - domain_restricted
      - user_already_member
      type: string
    UpdateTeamMemberRequest:
      description: Updates to be made to a team member. Only the fields provided in the request are updated.
      example:
        role: member
      properties:
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      type: object
    TeamMember:
      description: A user in a team.
      example:
        user_id: UAAAAAAAAA1
        team_id: BAAAAAAAAA1
        role: admin
      properties:
        user_id:
          description: The user ID.
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        team_id:
          description: The team ID.
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      - team_id
      - user_id
      type: object
    UpdateTeamMemberResponse:
      description: Successful response from an `updateTeamMember` request
      properties:
        team_member:
          $ref: '#/components/schemas/TeamMember'
      required:
      - team_member
      type: object
    ListTeamMembersResponse:
      description: Successful response from a `listTeamMembers` request
      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamMember'
          type: array
        continuation:
          description: 'If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.


            To retrieve all items, you might need to make multiple requests.'
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
  examples:
    TeamMemberNotFoundError:
      summary: The user is not a member of the team
      value:
        code: user_not_found
        message: User {userId} is not a member of team {teamId}
    UserNotManagedError:
      summary: The user is not managed by the organization
      value:
        code: user_not_managed
        message: User {userId} is not managed by the organization
    TeamNotFoundError:
      summary: The team was not found
      value:
        code: team_not_found
        message: Team {teamId} not found
    SsoRequiredError:
      summary: The team requires users to join via SSO
      value:
        code: permission_denied
        message: User must authenticate via SSO before being added to team {teamId}.
    UserNotFoundError:
      summary: The user was not found
      value:
        code: user_not_found
        message: User {userId} not found
  securitySchemes:
    oauthClientCredentials:
      flows:
        clientCredentials:
          scopes:
            admin:user:read: Read information about a Canva user.
            admin:user:write: Create a managed user in the organization.
            admin:team:read: Read information about a Canva team and its users.
            admin:team:write: Create or modify a Canva team, and add or remove its users.
            admin:group:read: Read information about a Canva group.
            admin:group:write: Create or modify a Canva group, and add or remove its users.
            admin:organization:read: Read information about the Canva organization.
            admin:auditevent:read: List audit events for the Canva organization.
          tokenUrl: https://api.canva.com/auth/v1/oauth/token
      type: oauth2
