        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      - description: The group ID.
        example: GAAAAAAAAA1
        explode: false
        in: path
        name: groupId
        required: true
