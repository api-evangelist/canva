- name: team_member
- name: user
paths:
  /v1/audit-events:
    get:
      description: Lists audit events.
      operationId: listAuditEvents
      parameters:
      - description: "The inclusive lower limit for the time when audit events were\
          \ ingested into the log (in seconds since the Unix Epoch). As this is based\
          \ on the time when events were ingested, the returned list of events may\
          \ contain some events that occurred before this timestamp."
        explode: true
        in: query
        name: ingested_after
        required: false
        schema:
          example: 1735650000
          format: int64
          minimum: 0
          type: integer
        style: form
      - description: "The exclusive upper limit for the time when audit events were\
          \ ingested into the log (in seconds since the Unix Epoch). As this is based\
          \ on the time when events were ingested, the returned list of events may\
          \ contain some events that occurred after this timestamp."
        explode: true
        in: query
        name: ingested_before
        required: false
        schema:
          example: 1759240800
          format: int64
          minimum: 0
          type: integer
        style: form
      - description: |-
          If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

          To retrieve all items, you might need to make multiple requests.
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of events to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditEventsResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                invalid_continuation:
                  $ref: '#/components/examples/InvalidContinuationError'
                bad_query_params:
                  $ref: '#/components/examples/BadQueryParamsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "403":
          content:
            application/json:
              examples:
                permission_denied:
                  $ref: '#/components/examples/PermissionDeniedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:auditevent:read
      tags:
      - audit_event
  /v1/teams/{teamId}/groups:
    get:
      description: Lists groups in the specified team.
      operationId: listGroups
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      - description: |-
          If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

          To retrieve all items, you might need to make multiple requests.
        example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of groups to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
          description: OK
        "404":
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:read
      tags:
      - group
    post:
      description: Creates a new group in a team.
      operationId: createGroup
      parameters:
      - description: The team ID the group belongs to.
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                display_name_unavailable:
                  $ref: '#/components/examples/DisplayNameUnavailableError'
                input_unsafe:
                  $ref: '#/components/examples/InputUnsafeError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "404":
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:write
      tags:
      - group
