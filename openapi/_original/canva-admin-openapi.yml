  /v1/teams/{teamId}/invitations/cancel:
    post:
      description: |-
        Cancels the pending invitation for an email address in a team, so it can
        no longer be accepted. Any invitation URL previously issued for that
        team and email stops working, and Canva sends no further reminders for
        it.

        The invitation is identified by `email` because invitations have no
        public ID in this version of the API.

        Cancelling is idempotent and always succeeds for a team you own,
        whether or not a pending invitation existed. The response doesn't
        reveal whether there was anything to cancel, so it's safe to retry. To
        find out whether an invitation is still pending, use
        `listTeamInvitations`; to find out whether the invitee already joined,
        use `listTeamMembers`.

        Cancelling doesn't affect a user who has already accepted. If
        acceptance happens first, this operation has no effect and the invitee
        remains a team member. If cancellation happens first, the invitee sees
        the standard invalid-invitation page when they follow their URL.

        To re-invite the same address after cancelling, call
        `createTeamInvitation` again. This issues a new invitation with a new
        URL.
      operationId: cancelTeamInvitation
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTeamInvitationRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/InvalidEmailError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "404":
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:write
      tags:
      - invitation
