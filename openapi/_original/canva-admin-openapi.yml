  /v1/teams/{teamId}/invitations:
    get:
      description: |-
        Lists pending single-use email invitations for a team in the caller's organization.

        The response contains pending invitations only. Accepted, cancelled, and expired
        invitations are omitted. Items include team, email, role, and expiry. They never include
        the invitation URL.

        Paginate with `limit` and `continuation`. `continuation` is an opaque token. Presence of
        `continuation` means more records exist. The last page omits `continuation`.
      operationId: listTeamInvitations
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      - description: |-
          If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

          To retrieve all items, you might need to make multiple requests.
        example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of invitations to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTeamInvitationsResponse'
          description: OK
        "404":
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:read
      tags:
      - invitation
    post:
      description: |-
        Creates a unique, email-bound, single-use invitation to join a team in the caller's
        organization, and returns the invitation URL for the caller to deliver to the invitee. Canva
        doesn't send an email unless the caller explicitly requests it.

        Unlike `createTeamMember`, the invitee doesn't need to be managed by the organization: any
        email address can be invited, including addresses on domains the organization hasn't
        verified. The invitee consents by accepting the invitation, logging in to their existing
        Canva account or signing up with the invited email, and then joins the team.

        Treat the returned `url` as a secret. Anyone with the URL can start the acceptance flow,
        although only an account with the invited email address can complete it. Don't log the URL
        or send it over insecure channels.

        This operation is create-or-refresh per team and email: if a pending invitation already
        exists for the invitee, it's returned with its expiry reset to 30 days from the request and
        its role updated to the requested role, rather than a duplicate being created. Callers must
        not assume the response is byte-for-byte immutable, because an expired-and-reaped
        invitation yields a new URL. It sends another email and replaces the reminder schedule when
        `send_email` is true. A call within the cooldown period returns a `429` without refreshing
        the invitation, sending email, or changing reminders.
      operationId: createTeamInvitation
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamInvitationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeamInvitationResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/InvalidEmailError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "403":
          content:
            application/json:
              examples:
                team_at_max_capacity:
                  $ref: '#/components/examples/TeamAtMaxCapacityError'
                domain_restricted:
                  $ref: '#/components/examples/DomainRestrictedError'
                invitation_not_allowed:
                  $ref: '#/components/examples/InvitationNotAllowedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        "409":
          content:
            application/json:
              examples:
                user_already_member:
                  $ref: '#/components/examples/UserAlreadyMemberError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        "429":
          content:
            application/json:
              examples:
                rate_limit_exceeded:
                  $ref: '#/components/examples/RateLimitExceededError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Too many requests
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:team:write
      tags:
      - invitation
  /v1/teams/{teamId}/invitations/find:
    post:
      description: |-
        Finds a pending single-use email invitation for a team in the caller's organization.

        The email address is restricted data and is accepted only in the JSON request body. The
        response contains zero or one invitation. A matching invitation includes the invitation URL
        so the caller can deliver it without refreshing the invitation.

        Treat the returned `url` as a secret. Don't log the URL or send it over insecure channels.
