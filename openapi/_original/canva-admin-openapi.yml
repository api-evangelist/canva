        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                continuation_not_supported_for_email:
                  $ref: '#/components/examples/ContinuationNotSupportedForEmailError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:read
      tags:
      - user
    post:
      description: |-
        Creates a managed user in the caller's organization. The request must meet the following requirements:

        - The email domain must be a verified domain owned by the caller's organization.
        - The SAML identity provider, resolved using the provided `idp_issuer` value, must belong to that organization.

        If the email address already belongs to an existing Canva account that isn't part of an organization, that account is brought into the organization instead of a new one being created, and the person might be asked to confirm this. Any existing properties for that user aren't updated with the values provided in the request.

        If successful, the response contains the user's Canva ID, email address, display name, first name, last name, SAML account (if any), and organization role.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                invalid_display_name:
                  $ref: '#/components/examples/InvalidDisplayNameError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "403":
          content:
            application/json:
              examples:
                idp_not_authorized:
                  $ref: '#/components/examples/IdpNotAuthorizedError'
                invalid_email_domain:
                  $ref: '#/components/examples/InvalidEmailDomainError'
                team_at_max_capacity:
                  $ref: '#/components/examples/TeamAtMaxCapacityError'
                user_in_max_teams:
                  $ref: '#/components/examples/UserInMaxTeamsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "409":
          content:
            application/json:
              examples:
                user_not_active:
                  $ref: '#/components/examples/UserNotActiveError'
                user_pending_consent:
                  $ref: '#/components/examples/UserPendingConsentError'
                saml_name_id_not_available:
                  $ref: '#/components/examples/SamlNameIdNotAvailableError'
                account_exists:
                  $ref: '#/components/examples/AccountExistsError'
                user_email_unverified:
                  $ref: '#/components/examples/UserEmailUnverifiedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:write
        - admin:team:write
      tags:
      - user
  /v1/users/find:
    post:
      description: |-
        Finds a user in the caller's organization by exact email.

        The email address is restricted data and is accepted only in the JSON request body. The
        response contains zero or one user.
      operationId: findUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindUserRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                found:
                  summary: Found user
                  value:
                    user:
                      id: UAAAAAAAAA1
                      display_name: Joe Smith
                      email: joe@acme.com
                      first_name: Joe
                      last_name: Smith
                      last_active_at: 1750300000
                      locale: en
                      role: admin
                no_match:
                  summary: No matching user found
                  value: {}
              schema:
                $ref: '#/components/schemas/FindUserResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:read
      tags:
      - user
  /v1/users/{userId}:
    get:
      description: Gets a user.
      operationId: getUser
      parameters:
      - description: The user ID.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
          description: OK
        "404":
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: '#/components/examples/UserNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:read
      tags:
      - user
    patch:
      description: |-
        Updates a user that is already managed by the caller's organization. Only the fields provided in the request are updated, and any omitted fields are left unchanged.

        The `name` object fields (`display_name`, `first_name`, and `last_name`) must be updated together. To clear a first or last name, set it to an empty string. Blank first and last names are allowed.
      operationId: updateUser
      parameters:
      - description: The user ID.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                invalid_display_name:
                  $ref: '#/components/examples/InvalidDisplayNameError'
                invalid_locale:
                  $ref: '#/components/examples/InvalidLocaleError'
                user_not_managed:
                  $ref: '#/components/examples/UserNotManagedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        "403":
          content:
            application/json:
              examples:
                idp_not_authorized:
                  $ref: '#/components/examples/IdpNotAuthorizedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "409":
          content:
            application/json:
              examples:
                user_linked_to_another_idp:
                  $ref: '#/components/examples/UserLinkedToAnotherIdpError'
                saml_name_id_not_available:
                  $ref: '#/components/examples/SamlNameIdNotAvailableError'
                user_pending_consent:
                  $ref: '#/components/examples/UserPendingConsentError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:user:write
      tags:
      - user
components:
  examples:
    InvalidContinuationError:
      summary: The continuation token is invalid
      value:
        code: bad_query_params
        message: The continuation token is malformed or was obtained from a different
          set of request parameters.
    BadQueryParamsError:
      summary: The request uses invalid parameters
      value:
        code: bad_query_params
        message: The request uses invalid parameters.
    PermissionDeniedError:
      summary: Client does not have permission to access audit events
      value:
        code: permission_denied
        message: Client does not have permission to access audit events.
    GroupNotFoundError:
      summary: The group was not found
      value:
        code: group_not_found
        message: "Group {groupId} not found"
    DisplayNameUnavailableError:
      summary: A group with the same name already exists
      value:
        code: display_name_unavailable
        message: A group with the same name already exists in the team.
    InputUnsafeError:
      summary: The input is unsafe
      value:
        code: input_unsafe
        message: Input is unsafe
    GroupMemberNotFoundError:
      summary: The user is not a member of the group
      value:
        code: user_not_found
        message: "User {userId} is not a member of group {groupId}"
    UserInMaxGroupsError:
      summary: The user has reached the maximum number of groups
      value:
        code: max_limit_reached
        message: "User {userId} has reached the maximum number (70) of groups"
    FindTeamInvitationFound:
      summary: A pending invitation matches the email
      value:
        invitation:
          team_id: BAAAAAAAAA1
          email: drsmith@brightsmiledental.com
          role: member
          expires_at: 1788499200
          url: https://www.canva.com/brand/join?token=EXAMPLEQi1pbnZpdGU&referrer=team-invite
    FindTeamInvitationNoMatch:
      summary: No pending invitation matches the email
      value: {}
    InvalidEmailError:
      summary: The email address is not valid
      value:
        code: invalid_field
        message: '''email'' must be a valid email address.'
    DomainRestrictedError:
      summary: The organization restricts invitations to email domains it owns
      value:
        code: domain_restricted
        message: An invitation can't be created for this email because only users
          with an email owned by the organization can be invited
    InvitationNotAllowedError:
      summary: An invitation can't be created for this team or recipient
      value:
        code: permission_denied
        message: An invitation can't be created for this team or recipient
    UserAlreadyMemberError:
      summary: The invitee is already a member of the team
      value:
        code: user_already_member
        message: "A user with this email is already a member of team {teamId}"
    RateLimitExceededError:
      summary: An invitation email can't be resent for this recipient
      value:
        code: too_many_requests
        message: Email can't be resent for this recipient within the resend cooldown
    CreateTeamSuccess:
      summary: A team was successfully created
      value:
        team:
          id: BAAAAAAAAA1
          name: Acme Team
          created_at: 1601404800
          updated_at: 1601404800
    UpdateTeamSuccess:
      summary: A team was successfully updated
      value:
        team:
          id: BAAAAAAAAA1
          name: Acme Team
          created_at: 1601404800
          updated_at: 1601404900
    TeamNameUnsafeError:
      summary: The team name contains unsafe input
      value:
        code: input_unsafe
        message: Team name contains unsafe input.
    SamlTeamIdConflictError:
      summary: A team with the same SAML team ID already exists
      value:
        code: saml_team_id_conflict
        message: A team with this SAML team ID already exists in the organization.
    TeamNotFoundError:
      summary: The team was not found
      value:
        code: team_not_found
        message: "Team {teamId} not found"
    ContinuationNotSupportedForSamlTeamIdError:
      summary: Continuation is not supported for listing teams by SAML team ID
      value:
        code: bad_query_params
        message: Continuation is not supported for listing teams by SAML team ID.
    TeamIsDefaultError:
      summary: The default team cannot be deleted
      value:
        code: team_is_default
        message: "Team {teamId} cannot be deleted as it is the organization's default\
          \ team."
    TeamMemberNotFoundError:
      summary: The user is not a member of the team
      value:
        code: user_not_found
        message: "User {userId} is not a member of team {teamId}"
    UserNotManagedError:
      summary: The user is not managed by the organization
      value:
        code: user_not_managed
        message: "User {userId} is not managed by the organization"
    TeamAtMaxCapacityError:
      summary: A target team has reached its maximum member capacity
      value:
        code: max_limit_reached
        message: One or more provided teams have reached its maximum member capacity
    SsoRequiredError:
      summary: The team requires users to join via SSO
      value:
        code: permission_denied
        message: "User must authenticate via SSO before being added to team {teamId}."
    UserNotFoundError:
      summary: The user was not found
      value:
        code: user_not_found
        message: "User {userId} not found"
    ContinuationNotSupportedForEmailError:
      summary: Continuation is not supported for listing users by email
      value:
        code: bad_query_params
        message: Continuation is not supported for listing users by email.
    IdpNotAuthorizedError:
      summary: The SAML identity provider is not owned by the caller's organization
        (or doesn't exist)
      value:
        code: permission_denied
        message: The identity provider is not owned by your organization.
    InvalidEmailDomainError:
      summary: The email domain is not a verified domain owned by the caller's organization
      value:
        code: permission_denied
        message: The email domain is not in your organization's verified domains.
    InvalidDisplayNameError:
      summary: The display name is not allowed
      value:
        code: invalid_field
        message: The supplied display_name is not allowed.
    InvalidLocaleError:
      summary: The locale is not a supported language
      value:
        code: invalid_field
        message: "The locale {locale} is not a supported language."
    UserNotActiveError:
      summary: The user matching the email is not active
      value:
        code: user_not_active
        message: The existing user matching this email is not active and can't be
          added.
    UserPendingConsentError:
      summary: The user is awaiting consent from a previous request
      value:
        code: user_pending_consent
        message: A previous request for this user is awaiting their consent. Wait
          for them to accept before retrying.
    SamlNameIdNotAvailableError:
      summary: The SAML name ID is already in use
      value:
        code: saml_name_id_not_available
        message: "The SAML name ID {nameId} is already associated with another user."
    UserLinkedToAnotherIdpError:
      summary: The user is already linked to a different SAML identity provider
      value:
        code: user_linked_to_another_idp
        message: "User {userId} already has a SAML account linked to a different identity\
          \ provider."
    AccountExistsError:
      summary: An account already exists for this email
      value:
        code: account_exists
        message: That email address is already associated with a Canva account.
    UserEmailUnverifiedError:
      summary: The existing account's email is not verified
      value:
        code: user_email_unverified
        message: "The existing account for this email hasn't verified its email address,\
          \ so it can't be linked to your organization."
    UserInMaxTeamsError:
      summary: The user has reached the maximum number of teams
      value:
        code: max_limit_reached
        message: "User {userId} has reached the maximum number of teams"
  schemas:
    ListAuditEventsResponse:
      description: Successful response from a `listAuditEvents` request
      properties:
        items:
          example:
          - id: 3849ef51-ca85-4028-bae3-1b8de3ee5738
            timestamp: 1704070800123
            actor:
              type: USER
              user:
                id: UXoqDbwwSbQ
                display_name: Jane Doe
                email: jane.doe@example.com
              team:
                id: BXeFatjDhdR
                display_name: Acme Team
              organization:
                id: OXtgecafZvh
                display_name: Acme Corporation
            target:
              target_type: RESOURCE
              resource_type: DESIGN
              id: DXWEBartcNg
              owner:
                user:
                  display_name: Jane Doe
                  email: jane.doe@example.com
                team:
                  id: BXeFatjDhdR
                  display_name: Acme Team
            action:
              type: VIEW_DESIGN
              view_type: VIEW_IN_EDITOR
              design_type: Presentation (16:9)
            outcome:
              result: PERMITTED
            context:
              ip_address: 192.0.2.123
              session: 41cfef61
              request_id: 220d18b47fcb2d23c72a2a954dff09cb
              device_id: d2805fafb9b50fe3f3d6ebbe221fc0e0883bf06b6bc285389147f3b259c2c4c1
          items:
            description: "A JSON object representing an audit event. For the structure\
              \ of each event, see [Audit events](https://www.canva.dev/docs/audit-logs/audit-events/)."
            type: object
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

            To retrieve all items, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    ErrorCode:
      description: |
        A short string indicating what failed. This field can be used to handle errors programmatically.
      enum:
      - permission_denied
      - too_many_requests
      - max_limit_reached
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - endpoint_not_found
      - invalid_access_token
      - missing_scope
      - invalid_field
      - input_unsafe
      - display_name_unavailable
      - team_not_found
      - group_not_found
      - team_is_default
      - user_not_found
      - saml_team_id_conflict
      - user_not_managed
      - saml_name_id_not_available
      - user_linked_to_another_idp
      - user_email_unverified
      - user_not_active
      - user_pending_consent
      - account_exists
      - domain_restricted
      - user_already_member
      type: string
    CreateGroupRequest:
