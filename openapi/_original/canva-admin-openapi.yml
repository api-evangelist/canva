      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamInvitation'
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

            To retrieve all items, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    CreateTeamInvitationResponse:
      description: Successful response from a `createTeamInvitation` request
      properties:
        invitation:
          $ref: '#/components/schemas/TeamInvitation'
      required:
      - invitation
      type: object
    FindTeamInvitationRequest:
      example:
        email: drsmith@brightsmiledental.com
      properties:
        email:
          description: The email address associated with the invitation.
          example: drsmith@brightsmiledental.com
          format: email
          maxLength: 254
          minLength: 1
          type: string
      required:
      - email
      type: object
    FindTeamInvitationResponse:
      description: Successful response from a `findTeamInvitation` request
      example:
        invitation:
          team_id: BAAAAAAAAA1
          email: drsmith@brightsmiledental.com
          role: member
          expires_at: 1788499200
          url: https://www.canva.com/brand/join?token=EXAMPLEQi1pbnZpdGU&referrer=team-invite
      properties:
        invitation:
          $ref: '#/components/schemas/TeamInvitation'
      type: object
    CancelTeamInvitationRequest:
      example:
        email: drsmith@brightsmiledental.com
      properties:
        email:
          description: The email address associated with the invitation.
          example: drsmith@brightsmiledental.com
          format: email
          maxLength: 254
          minLength: 1
          type: string
      required:
      - email
      type: object
    TeamInvitation:
      description: |-
        A pending invitation for an email address to join a team. The invitation record exists only
        while the invitation can still be accepted.
      example:
        team_id: BAAAAAAAAA1
        email: drsmith@brightsmiledental.com
        role: member
        expires_at: 1788499200
        url: https://www.canva.com/brand/join?token=EXAMPLEQi1pbnZpdGU&referrer=team-invite
      properties:
        team_id:
          description: The ID of the team the invitation grants access to.
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        email:
          description: The invited email address. Only an account with this email
            can accept.
          format: email
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
        expires_at:
          description: |-
            When the invitation expires, as a Unix timestamp (in seconds). This is always 30 days
            after the create or refresh request that issued it. Expired invitations can't be
            accepted.
          format: int64
          type: integer
        url:
          description: |-
            The invitation URL. Redirect the invitee to this URL to accept the invitation. Treat it
            as a secret: don't log it or send it over insecure channels. Create and a matched find
            result always return this field. Unfiltered list responses omit it.
          format: uri
          type: string
      required:
      - email
      - expires_at
      - role
      - team_id
      type: object
    GetOrganizationResponse:
      description: Successful response from a `getOrganization` request
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
      required:
      - organization
      type: object
    Organization:
      description: An organization.
      example:
        name: ACME Corporation
      properties:
        name:
          description: The name of the organization.
          type: string
      required:
      - name
      type: object
    CreateTeamRequest:
      description: Parameters for creating a new team in the organization.
      properties:
        name:
          description: The display name for the team.
          example: ACME Marketing Team
          maxLength: 255
          minLength: 1
          type: string
        saml_team_id:
          description: "An identifier you assign to a team. When a user signs in through\
            \ SSO, Canva reads the SAML `TeamId` attribute and adds them to the team\
            \ with the matching `saml_team_id`. Must be unique within your organization."
          example: brokerage-123
          maxLength: 255
          minLength: 1
          type: string
      required:
      - name
      type: object
    CreateTeamResponse:
      description: Successful response from a `createTeam` request.
      properties:
        team:
          $ref: '#/components/schemas/Team'
      required:
      - team
      type: object
    UpdateTeamRequest:
      description: Updates to be made to a team. Only the fields provided in the request
        are updated.
      properties:
        name:
          description: The display name for the team.
          example: ACME Marketing Team
          maxLength: 255
          minLength: 1
          type: string
        saml_team_id:
          description: "An identifier you assign to a team. When a user signs in through\
            \ SSO, Canva reads the SAML `TeamId` attribute and adds them to the team\
            \ with the matching `saml_team_id`. Must be unique within your organization."
          example: brokerage-123
          maxLength: 255
          minLength: 1
          type: string
      type: object
    UpdateTeamResponse:
      description: Successful response from an `updateTeam` request.
      properties:
        team:
          $ref: '#/components/schemas/Team'
      required:
      - team
      type: object
    GetTeamResponse:
      description: Successful response from a `getTeam` request
      properties:
        team:
          $ref: '#/components/schemas/Team'
      required:
      - team
      type: object
    ListTeamsResponse:
      description: Successful response from a `listTeams` request.
      properties:
        continuation:
          description: |-
            If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

            To retrieve all items, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
        items:
          items:
            $ref: '#/components/schemas/Team'
          type: array
      required:
      - items
      type: object
    SamlTeamId:
      description: "An identifier you assign to a team. When a user signs in through\
        \ SSO, Canva reads the SAML `TeamId` attribute and adds them to the team with\
        \ the matching `saml_team_id`. Must be unique within your organization."
      example: brokerage-123
      maxLength: 255
      minLength: 1
      type: string
    Team:
      description: A team.
      example:
        id: BAAAAAAAAA1
        name: Acme Team
        created_at: 1601404800
        updated_at: 1601404900
      properties:
        id:
          description: The team ID.
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        name:
          description: The name of the team.
          type: string
        created_at:
          description: "When the team was created, as a Unix timestamp (in seconds\
            \ since the Unix Epoch)."
          format: int64
          type: integer
        updated_at:
          description: "When the team was last updated, as a Unix timestamp (in seconds\
            \ since the Unix Epoch)."
          format: int64
          type: integer
        saml_team_id:
          description: "An identifier you assign to a team. When a user signs in through\
            \ SSO, Canva reads the SAML `TeamId` attribute and adds them to the team\
            \ with the matching `saml_team_id`. Must be unique within your organization."
          example: brokerage-123
          maxLength: 255
          minLength: 1
          type: string
      required:
      - created_at
      - id
      - name
      type: object
    ListTeamMembersResponse:
      description: Successful response from a `listTeamMembers` request
      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamMember'
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

            To retrieve all items, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    ListUserTeamMembershipsResponse:
      description: |-
        Successful response from a `listUserTeamMemberships` request.

        Contains every team membership for the user within the caller's organization. This list is
        not paginated: a user can belong to at most 100 teams in total, so all memberships are
        always returned in a single response.
      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamMember'
          type: array
      required:
      - items
      type: object
    GetTeamMemberResponse:
      description: Successful response from a `getTeamMember` request
      properties:
        team_member:
          $ref: '#/components/schemas/TeamMember'
      required:
      - team_member
      type: object
    UpdateTeamMemberRequest:
      description: Updates to be made to a team member. Only the fields provided in
        the request are updated.
      example:
        role: member
      properties:
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      type: object
    UpdateTeamMemberResponse:
      description: Successful response from an `updateTeamMember` request
      properties:
        team_member:
          $ref: '#/components/schemas/TeamMember'
      required:
      - team_member
      type: object
    CreateTeamMemberRequest:
      properties:
        user_id:
          description: The user ID.
          example: UAAAAAAAAA1
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      - user_id
      type: object
    CreateTeamMemberResponse:
      description: Successful response from a `createTeamMember` request
      properties:
        team_member:
          $ref: '#/components/schemas/TeamMember'
      required:
      - team_member
      type: object
    TeamMember:
      description: A user in a team.
      example:
        user_id: UAAAAAAAAA1
        team_id: BAAAAAAAAA1
        role: admin
      properties:
        user_id:
          description: The user ID.
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        team_id:
          description: The team ID.
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      - team_id
      - user_id
      type: object
    TeamMemberRole:
      description: The role of the member in the team.
      enum:
      - admin
      - designer
      - member
      type: string
    ListUsersResponse:
      description: Successful response from a `listUsers` request.
      properties:
        continuation:
          description: |-
            If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.

            To retrieve all items, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
        items:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
      - items
      type: object
    GetUserResponse:
      description: Successful response from a `getUser` request
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
      type: object
    User:
      description: A user.
      example:
        id: UAAAAAAAAA1
        display_name: Joe Smith
        email: joe@acme.com
        first_name: Joe
        last_name: Smith
        last_active_at: 1750300000
        locale: en
        role: admin
      properties:
        id:
          description: The user ID.
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        display_name:
          description: The display name of the user.
          type: string
        email:
          description: The email address of the user.
          format: email
          type: string
        first_name:
          description: The first name of the user.
          type: string
        last_name:
          description: The last name of the user.
          type: string
        last_active_at:
          description: "When the user was last active, as a Unix timestamp (in seconds\
            \ since the Unix Epoch)."
          format: int64
          type: integer
        locale:
          description: "The locale of the user, as an IETF BCP 47 language tag."
          example: en
          type: string
        role:
          $ref: '#/components/schemas/OrganizationMemberRole'
        saml_account:
          $ref: '#/components/schemas/SamlAccount'
      required:
      - id
      type: object
    OrganizationMemberRole:
      description: The role of the user in the organization.
      enum:
      - admin
      - brand_designer
      - member
      type: string
    CreateUserRequest:
      description: Parameters for creating a managed user in the organization.
      example:
        email: joe@acme.com
        display_name: Joe Smith
        first_name: Joe
        last_name: Smith
        locale: en
        saml_account:
          idp_issuer: https://sso.acme.com/saml/metadata
          name_id: joe.smith@acme.com
        team_memberships:
        - team_id: BAAAAAAAAA1
          role: member
      properties:
        email:
          description: |-
            The email address of the user. The email domain must be a verified domain owned by the
            caller's organization.
          example: joe@acme.com
          format: email
          maxLength: 254
          minLength: 1
          type: string
        display_name:
          description: The display name of the user.
          example: Joe Smith
          minLength: 1
          type: string
        first_name:
          description: The first name of the user.
          example: Joe
          type: string
        last_name:
          description: The last name of the user.
          example: Smith
          type: string
        locale:
          default: en
          description: "The locale of the user, as an IETF BCP 47 language tag. Must\
            \ be a supported language. Defaults to `en` if not provided."
          example: en
          type: string
        saml_account:
          $ref: '#/components/schemas/SamlAccount'
        team_memberships:
          description: "The teams the user is added to. At least one team membership\
            \ is required so that the user is visible in the [Get user](https://www.canva.dev/docs/admin/api-reference/users/get-user/)\
            \ and [List users](https://www.canva.dev/docs/admin/api-reference/users/list-users/)\
            \ API responses."
          items:
            $ref: '#/components/schemas/TeamMembership'
          minItems: 1
          type: array
      required:
      - display_name
      - email
      - saml_account
      - team_memberships
      type: object
    SamlAccount:
      description: The SAML account details used to link the user to the organization's
        identity provider for SSO.
      properties:
        idp_issuer:
          description: "The issuer id or entity id of the SAML identity provider.\
            \ Often a unique URL, but not always. Must resolve to an identity provider\
            \ owned by the caller's organization."
          example: https://sso.acme.com/saml/metadata
          minLength: 1
          type: string
        name_id:
          description: "The SAML NameID that identifies the user to the identity provider.\
            \ This value is case sensitive, and shouldn't change."
          example: joe.smith@acme.com
          minLength: 1
          type: string
      required:
      - idp_issuer
      - name_id
      type: object
    TeamMembership:
      description: "A team to add the user to on creation, with the user's role in\
        \ that team."
      properties:
        team_id:
          description: The team ID.
          example: BAAAAAAAAA1
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        role:
          $ref: '#/components/schemas/TeamMemberRole'
      required:
      - role
      - team_id
      type: object
    CreateUserResponse:
      description: Successful response from a `createUser` request.
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
      type: object
    UpdateUserRequest:
      description: |-
        Updates to be made to a user. Only the fields provided in the request are updated.

        To update the user's name, provide the `name` object with `display_name`, `first_name`, and `last_name`.

        To update the user's SAML name ID, provide the `saml_account` object with both `idp_issuer` and `name_id`. The `idp_issuer` must match the user's current identity provider (it acts as a guard and can't be changed with this API, so only `name_id` is updated).
      properties:
        name:
          $ref: '#/components/schemas/UserNameUpdate'
        locale:
          description: "The locale of the user, as an IETF BCP 47 language tag. Must\
            \ be a supported language."
          example: en-GB
          type: string
        saml_account:
          $ref: '#/components/schemas/SamlAccount'
      type: object
    UserNameUpdate:
      description: The name fields to update for the user.
      properties:
        display_name:
          description: The display name of the user.
          example: Joe Smith
          minLength: 1
          type: string
        first_name:
          description: The first name of the user. Set to an empty string to clear
            the first name.
          example: Joe
          type: string
        last_name:
          description: The last name of the user. Set to an empty string to clear
            the last name.
          example: Smith
          type: string
      required:
      - display_name
      - first_name
      - last_name
      type: object
    UpdateUserResponse:
      description: Successful response from an updateUser request.
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
      type: object
    FindUserRequest:
      example:
        email: drsmith@brightsmiledental.com
      properties:
        email:
          description: The email address of the user to find.
          example: drsmith@brightsmiledental.com
          format: email
          maxLength: 254
          minLength: 1
          type: string
      required:
      - email
      type: object
    FindUserResponse:
      description: Successful response from a `findUser` request
      example:
        user:
          id: UAAAAAAAAA1
          email: drsmith@brightsmiledental.com
      properties:
        user:
          $ref: '#/components/schemas/User'
      type: object
  securitySchemes:
    oauthClientCredentials:
      flows:
        clientCredentials:
          scopes:
            admin:user:read: Read information about a Canva user.
            admin:user:write: Create a managed user in the organization.
            admin:team:read: Read information about a Canva team and its users.
            admin:team:write: "Create or modify a Canva team, and add or remove its\
              \ users."
            admin:group:read: Read information about a Canva group.
            admin:group:write: "Create or modify a Canva group, and add or remove\
              \ its users."
            admin:organization:read: Read information about the Canva organization.
            admin:auditevent:read: List audit events for the Canva organization.
          tokenUrl: https://api.canva.com/auth/v1/oauth/token
      type: oauth2
