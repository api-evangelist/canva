          description: Partner has no access to the order.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials: []
      tags:
      - order_event
  /v1/events/order-error:
