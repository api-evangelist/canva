  schemas:
    Address:
      description: An address.
      example:
        address_line1: "374 Johnson Ave, Brooklyn"
        address_line2: Unit 1
        city: New York
        subdivision: US-NY
        postcode: "11206"
        country: US
      properties:
        address_line1:
          description: The address line 1 portion of the address.
          example: 1530 Aimco Blvd.
          maxLength: 255
          type: string
        address_line2:
          description: The address line 2 portion of the address. Can contain additional
            address information such as unit number or house name.
          example: Unit 1
          maxLength: 255
          type: string
        city:
          description: The city portion of the address.
          example: Mississauga
          maxLength: 255
          type: string
        subdivision:
          description: "ISO 3166-2 subdivision code of the address. Required for AU,\
            \ BR, CA, IN, JP, KR, MX, NZ, US."
          example: CA-ON
          maxLength: 6
          type: string
        postcode:
          description: The postcode/zipcode portion of the address.
          example: L4W 5K1
          maxLength: 12
          type: string
        country:
          description: ISO 3166-1 alpha-2 country code of the address. Includes the
            exceptionally reserved code IC for the autonomous Spanish region Canary
            Islands.
          example: CA
          maxLength: 2
          type: string
      required:
      - address_line1
      - city
      - country
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    ErrorCode:
      description: |
        A short string indicating what failed. This field can be used to handle errors programmatically.
      enum:
      - invalid_field
      - invalid_header_value
      - invalid_request
      - permission_denied
      - too_many_requests
      - not_found
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - endpoint_not_found
      - unsupported_version
      - invalid_access_token
      - revoked_access_token
      - invalid_client
      - unauthorized_client
      - invalid_basic_header
      type: string
    GetPrintKeysResponse:
      properties:
        keys:
          description: A JSON Web Key Set (JWKS) with public keys used for signing
            requests. You can use this JWKS to verify that a request was sent from
            Canva.
          example:
          - kid: a418dc7d-ecc5-5c4b-85ce-e1104a8addbe
            kty: OKP
            crv: Ed25519
            x: aIQtqd0nDfB-ug0DrzZbwTum-1ITdXvKxGFak_1VB2j
          - kid: c8de5bec1-1b88-4ddaae04acc-ce415-5d7
            kty: OKP
            crv: Ed25519
            x: m2d1FT-gfBXxIzKwdQVTra0D-aBq_ubZ1jI0GuvkDtn
          items:
            $ref: '#/components/schemas/EdDsaJwk'
          type: array
      required:
      - keys
      type: object
    EdDsaJwk:
      description: |-
        A JSON Web Key Set (JWKS) using the Edwards-curve Digital Signature Algorithm (EdDSA), as
        described in [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#appendix-A).
      properties:
        kid:
          description: "The key ID, a unique identifier for the public key. When the\
            \ keys used to sign requests are rotated, you can use this ID to select\
            \ the correct key within a JWKS during the key rollover. This value is\
            \ case-sensitive."
          type: string
        kty:
          description: |-
            The key type, which identifies the cryptographic algorithm family used with the key, such as `RSA` or `EC`. Only Octet Key Pairs (OKPs) are supported.
            This value is case-sensitive. For more information, see [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).
          type: string
        crv:
          description: "The curve property, which identifies the curve used for elliptical\
            \ curve encryptions. Only `Ed25519` is supported. For more information,\
            \ see [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#section-2)."
          type: string
        x:
          description: |-
            The public key of an elliptical curve encryption. The key
            is encoded with `Base64urlUInt`. For more information, see [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037#section-2).
          type: string
      required:
      - crv
      - kid
      - kty
      - x
      type: object
    PickupLocation:
      description: Details about a pickup location.
      properties:
        id:
          description: The internal reference of the location on the partners system.
          example: partnerLocation1234
          maxLength: 255
          type: string
        display_name:
          description: The display name of the location. This is what Canva customers
            can expect the location to be called.
          example: Partner Fake Location
          maxLength: 255
          type: string
        phone:
          description: The contact phone number of the location.
          example: (555) 555-1234
          maxLength: 255
          type: string
        timezone:
          description: The timezone of the location in tz format.
          example: Australia/Melbourne
          maxLength: 255
          type: string
        address:
          $ref: '#/components/schemas/Address'
        geolocation:
          $ref: '#/components/schemas/Geolocation'
        receiving_from_locations:
          description: A list of locations that are allowed to produce or transfer
            items to this pickup location.
          example:
          - partnerLocation1234_production
          - partnerLocation1234_transfer
          items:
            description: The internal reference of the location on the partners system.
            example: Australia/Melbourne
            maxLength: 255
            type: string
          minLength: 1
          type: array
        pickup_hours:
          $ref: '#/components/schemas/PickupHours'
      required:
      - address
      - display_name
      - geolocation
      - id
      - phone
      - pickup_hours
      - timezone
      type: object
      x-ref-extensions:
        address:
          description: The address details of the location.
        geolocation:
          description: The geolocation of the location.
    Geolocation:
      description: Longitude and latitude of a location.
      example:
        latitude: -33.8853
        longitude: 151.2088
      properties:
        latitude:
          description: The latitude of the geolocation.
          example: -33.8853
          maximum: 90.0
          minimum: -90.0
          type: number
        longitude:
          description: The longitude of the geolocation.
          example: 151.2088
          maximum: 180.0
          minimum: -180.0
          type: number
      required:
      - latitude
      - longitude
      type: object
    PickupHours:
      description: "Pickup hours for a pickup location. If hours do not exist for\
        \ a day, the store is considered closed."
      example:
        monday_hours:
          open_time_hour: 10
          open_time_minute: 0
          close_time_hour: 17
          close_time_minute: 30
        tuesday_hours:
          open_time_hour: 10
          open_time_minute: 0
          close_time_hour: 17
          close_time_minute: 30
        wednesday_hours:
          open_time_hour: 10
          open_time_minute: 0
          close_time_hour: 17
          close_time_minute: 30
        thursday_hours:
          open_time_hour: 10
          open_time_minute: 0
          close_time_hour: 17
          close_time_minute: 30
        friday_hours:
          open_time_hour: 10
          open_time_minute: 0
          close_time_hour: 17
          close_time_minute: 30
        saturday_hours:
          open_time_hour: 9
          open_time_minute: 0
          close_time_hour: 17
          close_time_minute: 30
        sunday_hours:
          open_time_hour: 9
          open_time_minute: 0
          close_time_hour: 12
          close_time_minute: 0
      properties:
        monday_hours:
          $ref: '#/components/schemas/Hours'
        tuesday_hours:
          $ref: '#/components/schemas/Hours'
        wednesday_hours:
          $ref: '#/components/schemas/Hours'
        thursday_hours:
          $ref: '#/components/schemas/Hours'
        friday_hours:
          $ref: '#/components/schemas/Hours'
        saturday_hours:
          $ref: '#/components/schemas/Hours'
        sunday_hours:
          $ref: '#/components/schemas/Hours'
      type: object
      x-ref-extensions:
        monday_hours:
          description: "The pickup hours for Monday for the location. If not provided,\
            \ pickup will not be available for Monday."
        tuesday_hours:
          description: "The pickup hours for Tuesday for the location. If not provided,\
            \ pickup will not be available for Tuesday."
        wednesday_hours:
          description: "The pickup hours for Wednesday for the location. If not provided,\
            \ pickup will not be available for Wednesday."
        thursday_hours:
          description: "The pickup hours for Thursday for the location. If not provided,\
            \ pickup will not be available for Thursday."
        friday_hours:
          description: "The pickup hours for Friday for the location. If not provided,\
            \ pickup will not be available for Friday."
        saturday_hours:
          description: "The pickup hours for Saturday for the location. If not provided,\
            \ pickup will not be available for Saturday."
        sunday_hours:
          description: "The pickup hours for Sunday for the location. If not provided,\
            \ pickup will not be available for Sunday."
    Hours:
      description: |-
        Details on the opening and closing time for a pickup location.

        The open time must be before close time. Hours must be open for at least a minute.
      example:
        open_time_hour: 10
        open_time_minute: 0
        close_time_hour: 18
        close_time_minute: 0
      properties:
        open_time_hour:
          description: The hour part of the time the store opens in 24-hour format.
          example: 10
          format: int32
          maximum: 23
          minimum: 0
          type: integer
        open_time_minute:
          description: The minute part of the time the store opens.
          example: 0
          format: int32
          maximum: 59
          minimum: 0
          type: integer
        close_time_hour:
          description: The hour part of the time the store closes in 24-hour format.
          example: 18
          format: int32
          maximum: 23
          minimum: 0
          type: integer
        close_time_minute:
          description: The minute part of the time the store closes.
          example: 0
          format: int32
          maximum: 59
          minimum: 0
          type: integer
      required:
      - close_time_hour
      - close_time_minute
      - open_time_hour
      - open_time_minute
      type: object
    FindLocationsResponse:
      description: "The list of retrieved locations, and an optional continuation\
        \ token to get the remaining locations."
      properties:
        locations:
          description: List of pickup locations currently available for the partner.
          items:
            $ref: '#/components/schemas/PickupLocation'
          type: array
        continuation:
          description: "A continuation token. If the success response contains a continuation\
            \ token, the list contains more items you can list. You can use this token\
            \ as a query parameter and retrieve more items from the list. This value\
            \ should be NULL if no more results are available."
          example: edf3
          maxLength: 255
          type: string
      required:
      - locations
    OrderReferenceID:
      description: "A unique, case-sensitive ID of the order in Canva's system. This\
        \ must be the same value as the `orderReferenceId` path parameter."
      example: FB123456789
      maxLength: 255
      type: string
    OrderInvoiceUrl:
      description: "A temporary URL for the print partner to download an order invoice.\
        \ This can be a taxation requirement for some countries. This is only included\
        \ for certain partners, and can be configured in the API settings."
      example: https://s3-external-1.amazonaws.com/bucket/FB123456789/invoice
      type: string
    QuotedLatestFulfillmentDate:
      description: "The latest date Canva has shown to the customer by which the order\
        \ will be delivered or available for pickup, as a Unix timestamp (in seconds\
        \ since the Unix Epoch)."
      example: 1726448251
      format: int64
      type: integer
    ItemReferenceID:
      description: "A unique, case-sensitive ID for an order item that the partner\
        \ can use when communicating with Canva."
      example: FI123456789
      maxLength: 255
      type: string
    CreateOrderRequest:
      description: An order to create.
      properties:
        request_type:
          $ref: '#/components/schemas/CreateOrderRequestType'
        order:
          $ref: '#/components/schemas/CreateOrder'
      required:
      - order
      - request_type
      type: object
    UpdateOrderRequest:
      description: Updates to be made to an order.
      properties:
        request_type:
          $ref: '#/components/schemas/UpdateOrderRequestType'
        order_reference_id:
          description: "A unique, case-sensitive ID of the order in Canva's system.\
            \ This must be the same value as the `orderReferenceId` path parameter."
          example: FB123456789
          maxLength: 255
          type: string
        updates:
          $ref: '#/components/schemas/Updates'
      required:
