  headers:
    X-Canva-Public-Api-Version:
      description: The version of the Canva Print Standard API used in the request.
      explode: false
      schema:
        example: 2025-08-10
        format: date
        type: string
      style: simple
  parameters:
    ApiSpecificationVersionPath:
      description: "The API version to return the specification for, for example `latest`."
      explode: false
      in: path
      name: version
      required: true
      schema:
        example: latest
        pattern: "^[a-zA-Z0-9_-]{1,50}$"
        type: string
      style: simple
    FindLocationsCountryQuery:
      description: The ISO 3166-1 alpha-2 country code to filter the returned partner
        locations.
      explode: true
      in: query
      name: country
      required: false
      schema:
        example: US
        type: string
      style: form
    FindLocationsContinuationQuery:
      description: |-
        If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list.

        To retrieve all items, you might need to make multiple requests.
      explode: true
      in: query
      name: continuation
      required: false
      schema:
        type: string
      style: form
    FindLocationsLimitQuery:
      description: "The limit for the number of results to return. If the available\
        \ items are more than the limit, then the response will include a continuation\
        \ token."
      explode: true
      in: query
      name: limit
      required: true
      schema:
        type: integer
      style: form
    OrderReferenceIdPath:
      description: "Unique, case-sensitive string identifying the order in Canva's\
        \ system."
      explode: false
      in: path
      name: orderReferenceId
      required: true
      schema:
        example: FB123456789
        pattern: "^[a-zA-Z0-9_-]{1,11}$"
        type: string
      style: simple
    ApiVersionHeader:
      description: "The version of the Canva Print API used in the request. If not\
        \ specified, the latest version is assumed."
      explode: false
      in: header
      name: X-Canva-Public-Api-Version
      required: false
      schema:
        example: 2025-08-10
        format: date
        type: string
      style: simple
    ApiSignatureHeader:
      description: The Canva request signature. This is used to verify the request
        is legitimate and was not tampered with in transit.
      explode: false
      in: header
      name: X-Canva-Signature
      required: true
      schema:
        example: xxx.yyy.zzz
        type: string
      style: simple
    PrintClientIdHeader:
      description: Unique ID of the print partner making the request.
      example: Ym9zY236Ym9zY28=
      explode: false
      in: header
      name: X-Canva-Print-Client-Id
      required: true
      schema:
        type: string
      style: simple
