openapi: 3.2.0
info:
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  description: API for building integrations to manage Canva Print orders with suppliers
  license:
    name: ©2024 All Rights Reserved
  termsOfService: https://www.canva.com/trust/legal/
  title: Canva Print Key API
  version: 2025-04-14
servers:
- description: Canva Print API
  url: https://api.canva.com/print
tags:
- name: key
paths:
  /v1/keys:
    get:
      description: 'Gets a JSON Web Key Set (JWKS) containing public keys that are used to verify the authenticity of requests from the Canva Print API. The JWKS format follows RFC-7517 specifications.


        You must use these keys to decrypt request signatures and verify that requests originated from Canva. This helps protect against replay attacks.


        Canva might occasionally rotate these keys. We recommend you cache the keys returned from this API, and only access this API when you receive a request signed with an unrecognized key. This lets you verify requests quicker than fetching keys every time you receive a request from Canva.'
      operationId: getPrintKeys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrintKeysResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      tags:
      - key
      summary: Get print keys
      x-summary-source: derived
components:
  schemas:
    EdDsaJwk:
      description: 'A JSON Web Key Set (JWKS) using the Edwards-curve Digital Signature Algorithm (EdDSA), as

        described in [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#appendix-A).'
      properties:
        kid:
          description: The key ID, a unique identifier for the public key. When the keys used to sign requests are rotated, you can use this ID to select the correct key within a JWKS during the key rollover. This value is case-sensitive.
          type: string
        kty:
          description: 'The key type, which identifies the cryptographic algorithm family used with the key, such as `RSA` or `EC`. Only Octet Key Pairs (OKPs) are supported.

            This value is case-sensitive. For more information, see [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).'
          type: string
        crv:
          description: The curve property, which identifies the curve used for elliptical curve encryptions. Only `Ed25519` is supported. For more information, see [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).
          type: string
        x:
          description: 'The public key of an elliptical curve encryption. The key

            is encoded with `Base64urlUInt`. For more information, see [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037#section-2).'
          type: string
      required:
      - crv
      - kid
      - kty
      - x
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    ErrorCode:
      description: 'A short string indicating what failed. This field can be used to handle errors programmatically.

        '
      enum:
      - invalid_field
      - invalid_header_value
      - invalid_request
      - permission_denied
      - too_many_requests
      - not_found
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - endpoint_not_found
      - unsupported_version
      - invalid_access_token
      - revoked_access_token
      - invalid_client
      - unauthorized_client
      - invalid_basic_header
      type: string
    GetPrintKeysResponse:
      properties:
        keys:
          description: A JSON Web Key Set (JWKS) with public keys used for signing requests. You can use this JWKS to verify that a request was sent from Canva.
          example:
          - kid: a418dc7d-ecc5-5c4b-85ce-e1104a8addbe
            kty: OKP
            crv: Ed25519
            x: aIQtqd0nDfB-ug0DrzZbwTum-1ITdXvKxGFak_1VB2j
          - kid: c8de5bec1-1b88-4ddaae04acc-ce415-5d7
            kty: OKP
            crv: Ed25519
            x: m2d1FT-gfBXxIzKwdQVTra0D-aBq_ubZ1jI0GuvkDtn
          items:
            $ref: '#/components/schemas/EdDsaJwk'
          type: array
      required:
      - keys
      type: object
  securitySchemes:
    oauthClientCredentials:
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.canva.com/auth/v1/oauth/token
      type: oauth2
x-print-outgoing-paths:
  /locations:
    get:
      operationId: findLocations
      description: 'Gets up-to-date information on the print partner''s locations that support in-store pickup.


        Canva is interested in:


        - The address of each pickup location.

        - Production and transfer locations that supply to each pickup location.

        - The opening hours of each pickup location.

        '
      parameters:
      - $ref: '#/components/parameters/ApiVersionHeader'
      - $ref: '#/components/parameters/ApiSignatureHeader'
      - $ref: '#/components/parameters/FindLocationsCountryQuery'
      - $ref: '#/components/parameters/FindLocationsContinuationQuery'
      - $ref: '#/components/parameters/FindLocationsLimitQuery'
      responses:
        '200':
          $ref: '#/components/responses/FindLocationsSuccessResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
  /v1/orders:
    post:
      operationId: createOrder
      description: 'Creates an order on the print partner''s system. This operation lets Canva request a partner to commence production on an order.


        As part of the request, Canva sends an `orderReferenceId` and a list of `items` to print.


        Requests to this endpoint should be idempotent. If a provided `orderReferenceId` already exists in the partner system, and:


        - The item `item_reference_id`s match and are not canceled: A success response should be returned.

        - The item `item_reference_id`s match but items requested in the request are canceled: An error response should be returned.

        - The item `item_reference_id`s don''t match: An error response should be returned.

        '
      parameters:
      - $ref: '#/components/parameters/ApiVersionHeader'
      - $ref: '#/components/parameters/ApiSignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/CreateOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreateOrderSuccessResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
  /v1/orders/{orderReferenceId}:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    - $ref: '#/components/parameters/ApiSignatureHeader'
    - $ref: '#/components/parameters/OrderReferenceIdPath'
    get:
      operationId: getOrder
      description: Gets an order from the print partner's system.
      responses:
        '200':
          $ref: '#/components/responses/GetOrderSuccessResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    patch:
      operationId: updateOrder
      description: 'Updates an order in the print partner''s system.


        - Changes to an order are restricted only to the delivery address and customer details of the order.

        - Updates to an order aren''t allowed if every item of the order has been canceled.

        - The order update request can be denied if the update isn''t possible. For example, if the order contains items that have already shipped.

        '
      requestBody:
        $ref: '#/components/requestBodies/UpdateOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/UpdateOrderSuccessResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /v1/orders/{orderReferenceId}/cancel:
    post:
      operationId: cancelOrder
      description: 'Cancels items in an order in the print partner''s system.


        For cancel requests, Canva sends the `item_reference_ids` to cancel. For cancelling an entire order, Canva sends the `item_reference_ids` for all items in the order.


        The request can be denied if the cancellation is not possible. For example, if production on the order''s item has already started.

        '
      parameters:
      - $ref: '#/components/parameters/ApiVersionHeader'
      - $ref: '#/components/parameters/ApiSignatureHeader'
      - $ref: '#/components/parameters/OrderReferenceIdPath'
      requestBody:
        $ref: '#/components/requestBodies/CancelOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/CancelOrderSuccessResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
