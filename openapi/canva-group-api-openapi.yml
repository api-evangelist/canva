openapi: 3.2.0
info:
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  description: REST API for building admin integrations with Canva
  license:
    name: ©2025 All Rights Reserved
  termsOfService: https://www.canva.com/trust/legal/
  title: Canva Admin Group API
  version: 2026-08-18
servers:
- description: Admin API
  url: https://api.canva.com/admin
tags:
- name: Group
paths:
  /v1/teams/{teamId}/groups:
    get:
      description: Lists groups in the specified team.
      operationId: listGroups
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: 'If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.


          To retrieve all items, you might need to make multiple requests.'
        example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of groups to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:read
      tags:
      - Group
      summary: List groups
      x-summary-source: derived
    post:
      description: Creates a new group in a team.
      operationId: createGroup
      parameters:
      - description: The team ID the group belongs to.
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                display_name_unavailable:
                  $ref: '#/components/examples/DisplayNameUnavailableError'
                input_unsafe:
                  $ref: '#/components/examples/InputUnsafeError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:write
      tags:
      - Group
      summary: Create group
      x-summary-source: derived
  /v1/teams/{teamId}/groups/{groupId}:
    delete:
      description: Deletes a group in a team. This removes the group and its memberships, but doesn't delete the users who were members of the group.
      operationId: deleteGroup
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: The group ID.
        example: GAAAAAAAAA1
        explode: false
        in: path
        name: groupId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '204':
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                group_not_found:
                  $ref: '#/components/examples/GroupNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:write
      tags:
      - Group
      summary: Delete group
      x-summary-source: derived
    get:
      description: Gets a group in a team.
      operationId: getGroup
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: The group ID.
        example: GAAAAAAAAA1
        explode: false
        in: path
        name: groupId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                group_not_found:
                  $ref: '#/components/examples/GroupNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:read
      tags:
      - Group
      summary: Get group
      x-summary-source: derived
    patch:
      description: Updates a group in a team.
      operationId: updateGroup
      parameters:
      - description: The team ID.
        example: BAAAAAAAAA1
        explode: false
        in: path
        name: teamId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      - description: The group ID.
        example: GAAAAAAAAA1
        explode: false
        in: path
        name: groupId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGroupResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                display_name_unavailable:
                  $ref: '#/components/examples/DisplayNameUnavailableError'
                input_unsafe:
                  $ref: '#/components/examples/InputUnsafeError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '404':
          content:
            application/json:
              examples:
                team_not_found:
                  $ref: '#/components/examples/TeamNotFoundError'
                group_not_found:
                  $ref: '#/components/examples/GroupNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthClientCredentials:
        - admin:group:write
      tags:
      - Group
      summary: Update group
      x-summary-source: derived
components:
  schemas:
    GetGroupResponse:
      description: Successful response from a `getGroup` request.
      properties:
        group:
          $ref: '#/components/schemas/Group'
      required:
      - group
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    UpdateGroupResponse:
      description: Successful response from an `updateGroup` request.
      properties:
        group:
          $ref: '#/components/schemas/Group'
      required:
      - group
      type: object
    CreateGroupRequest:
      properties:
        name:
          description: The display name for the group.
          example: ACME Marketing Group
          maxLength: 255
          minLength: 1
          type: string
        description:
          description: The description for the group.
          example: All staff members in the marketing department.
          maxLength: 255
          type: string
      required:
      - name
      type: object
    Group:
      description: A group.
      example:
        id: GAAAAAAAAA1
        name: ACME Marketing Group
        description: All staff members in the marketing department.
        created_at: 1601404800
        updated_at: 1601404900
      properties:
        id:
          description: The group ID. This ID is generated by Canva and is unique within the team.
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        name:
          description: The name of the group.
          type: string
        description:
          description: The description of the group.
          type: string
        created_at:
          description: When the group was created, as a Unix timestamp (in seconds since the Unix Epoch).
          format: int64
          type: integer
        updated_at:
          description: When the group was last updated, as a Unix timestamp (in seconds since the Unix Epoch).
          format: int64
          type: integer
      required:
      - created_at
      - id
      - name
      - updated_at
      type: object
    UpdateGroupRequest:
      description: Updates to be made to a group. Only the fields you provide in the request are updated.
      properties:
        name:
          description: A display name for the group.
          example: ACME Marketing Group
          maxLength: 255
          minLength: 1
          type: string
        description:
          description: A description for the group.
          example: All staff members in the marketing department.
          maxLength: 255
          type: string
      type: object
    CreateGroupResponse:
      description: Successful response from a `createGroup` request.
      properties:
        group:
          $ref: '#/components/schemas/Group'
      required:
      - group
      type: object
    ListGroupsResponse:
      description: Successful response from a `listGroups` request.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Group'
          type: array
        continuation:
          description: 'If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.


            To retrieve all items, you might need to make multiple requests.'
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    ErrorCode:
      description: 'A short string indicating what failed. This field can be used to handle errors programmatically.

        '
      enum:
      - permission_denied
      - too_many_requests
      - max_limit_reached
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - endpoint_not_found
      - invalid_access_token
      - missing_scope
      - invalid_field
      - input_unsafe
      - display_name_unavailable
      - team_not_found
      - group_not_found
      - team_is_default
      - user_not_found
      - saml_team_id_conflict
      - user_not_managed
      - saml_name_id_not_available
      - user_linked_to_another_idp
      - user_email_unverified
      - user_not_active
      - user_pending_consent
      - account_exists
      - domain_restricted
      - user_already_member
      type: string
  examples:
    DisplayNameUnavailableError:
      summary: A group with the same name already exists
      value:
        code: display_name_unavailable
        message: A group with the same name already exists in the team.
    TeamNotFoundError:
      summary: The team was not found
      value:
        code: team_not_found
        message: Team {teamId} not found
    GroupNotFoundError:
      summary: The group was not found
      value:
        code: group_not_found
        message: Group {groupId} not found
    InputUnsafeError:
      summary: The input is unsafe
      value:
        code: input_unsafe
        message: Input is unsafe
  securitySchemes:
    oauthClientCredentials:
      flows:
        clientCredentials:
          scopes:
            admin:user:read: Read information about a Canva user.
            admin:user:write: Create a managed user in the organization.
            admin:team:read: Read information about a Canva team and its users.
            admin:team:write: Create or modify a Canva team, and add or remove its users.
            admin:group:read: Read information about a Canva group.
            admin:group:write: Create or modify a Canva group, and add or remove its users.
            admin:organization:read: Read information about the Canva organization.
            admin:auditevent:read: List audit events for the Canva organization.
          tokenUrl: https://api.canva.com/auth/v1/oauth/token
      type: oauth2
