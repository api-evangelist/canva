description: >-
  Binding between Canva's hosted MCP server (https://mcp.canva.com/mcp) and the Connect API
  OpenAPI operations behind it.
  IMPORTANT — READ THE SHAPE BEFORE READING THE ROWS. Canva's MCP `tools/list` is OAuth-gated
  (HTTP 401 anonymously), so the tool NAMES and inputSchemas could not be enumerated and NONE
  ARE INVENTED HERE. What the server does publish anonymously, via RFC 9728 Protected Resource
  Metadata, is its full scope list. Every row below is therefore keyed on a DECLARED MCP SCOPE
  rather than a tool name, and binds that scope to the exact OpenAPI operationIds that require
  it. This is a real, checkable derivation from two real artifacts; upgrade it to tool-keyed
  rows once an authenticated introspection of tools/list is possible.
