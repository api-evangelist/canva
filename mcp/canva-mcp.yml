source: https://mcp.canva.com/mcp (HTTP 401 + WWW-Authenticate challenge), https://mcp.canva.com/.well-known/oauth-protected-resource
  (HTTP 200), https://mcp.canva.com/.well-known/oauth-authorization-server (HTTP 200), https://www.canva.dev/docs/connect/mcp-server.md
  (HTTP 200), https://www.canva.dev/docs/apps/mcp/tools/ (HTTP 200, documented tool table), https://www.canva.dev/docs/apps/dev-mcp-server.md
  (HTTP 200)
description: Canva ships TWO distinct MCP surfaces and they are not interchangeable. (1) A hosted, remote MCP server
  at https://mcp.canva.com/mcp — the "Canva AI Connector" — which an MCP client POSTs to directly after an OAuth
  2.1 authorization-code flow; it advertises OAuth Protected Resource Metadata (RFC 9728) and Authorization Server
  Metadata (RFC 8414), including Dynamic Client Registration. (2) A local stdio "Canva Dev MCP server" launched
  with `npx -y @canva/cli@latest mcp`, aimed at AI-assisted development of Canva apps and integrations (documentation
  and tooling assistance), not at operating a user's designs.
deployment:
  mode: both
  endpoint: https://mcp.canva.com/mcp
  install: npx -y @canva/cli@latest mcp
  package: https://www.npmjs.com/package/@canva/cli
  auth: oauth
  verified: probed
  probe_prior: (never probed)
  probe: gated
  probe_why: RFC 9728 challenge on the MCP path only
