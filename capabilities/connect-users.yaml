naftiko: 1.0.0-alpha2
info:
  label: Canva Connect API — Users
  description: 'Canva Connect API — Users. 1 operations. Lead operation: Canva Get Current User. Self-contained Naftiko capability
    covering one Canva business surface.'
  tags:
  - Canva
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CANVA_API_KEY: CANVA_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-users
    baseUri: https://api.canva.com/rest/v1
    description: Canva Connect API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users-me
      path: /users/me
      operations:
      - name: getusersme
        method: GET
        description: Canva Get Current User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CANVA_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-users-rest
    port: 8080
    description: REST adapter for Canva Connect API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/users/me
      name: users-me
      description: REST surface for users-me.
      operations:
      - method: GET
        name: getusersme
        description: Canva Get Current User
        call: connect-users.getusersme
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Canva Connect API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: canva-get-current-user
      description: Canva Get Current User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-users.getusersme
      outputParameters:
      - type: object
        mapping: $.
