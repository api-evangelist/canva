naftiko: 1.0.0-alpha2
info:
  label: Canva Connect API — Comments
  description: 'Canva Connect API — Comments. 2 operations. Lead operation: Canva Create a Comment. Self-contained Naftiko
    capability covering one Canva business surface.'
  tags:
  - Canva
  - Comments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CANVA_API_KEY: CANVA_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-comments
    baseUri: https://api.canva.com/rest/v1
    description: Canva Connect API — Comments business capability. Self-contained, no shared references.
    resources:
    - name: comments
      path: /comments
      operations:
      - name: createcomment
        method: POST
        description: Canva Create a Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: comments-commentId-replies
      path: /comments/{commentId}/replies
      operations:
      - name: createreply
        method: POST
        description: Canva Create a Reply to a Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: commentId
          in: path
          type: string
          description: The parent comment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CANVA_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-comments-rest
    port: 8080
    description: REST adapter for Canva Connect API — Comments. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/comments
      name: comments
      description: REST surface for comments.
      operations:
      - method: POST
        name: createcomment
        description: Canva Create a Comment
        call: connect-comments.createcomment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/comments/{commentid}/replies
      name: comments-commentid-replies
      description: REST surface for comments-commentId-replies.
      operations:
      - method: POST
        name: createreply
        description: Canva Create a Reply to a Comment
        call: connect-comments.createreply
        with:
          commentId: rest.commentId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-comments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Canva Connect API — Comments. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: canva-create-comment
      description: Canva Create a Comment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-comments.createcomment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: canva-create-reply-comment
      description: Canva Create a Reply to a Comment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-comments.createreply
      with:
        commentId: tools.commentId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
