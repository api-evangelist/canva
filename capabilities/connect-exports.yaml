naftiko: 1.0.0-alpha2
info:
  label: Canva Connect API — Exports
  description: 'Canva Connect API — Exports. 2 operations. Lead operation: Canva Create a Design Export Job. Self-contained
    Naftiko capability covering one Canva business surface.'
  tags:
  - Canva
  - Exports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CANVA_API_KEY: CANVA_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-exports
    baseUri: https://api.canva.com/rest/v1
    description: Canva Connect API — Exports business capability. Self-contained, no shared references.
    resources:
    - name: exports
      path: /exports
      operations:
      - name: createdesignexportjob
        method: POST
        description: Canva Create a Design Export Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: exports-exportId
      path: /exports/{exportId}
      operations:
      - name: getdesignexportjob
        method: GET
        description: Canva Get a Design Export Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CANVA_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-exports-rest
    port: 8080
    description: REST adapter for Canva Connect API — Exports. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/exports
      name: exports
      description: REST surface for exports.
      operations:
      - method: POST
        name: createdesignexportjob
        description: Canva Create a Design Export Job
        call: connect-exports.createdesignexportjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/exports/{exportid}
      name: exports-exportid
      description: REST surface for exports-exportId.
      operations:
      - method: GET
        name: getdesignexportjob
        description: Canva Get a Design Export Job
        call: connect-exports.getdesignexportjob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-exports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Canva Connect API — Exports. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: canva-create-design-export-job
      description: Canva Create a Design Export Job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-exports.createdesignexportjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: canva-get-design-export-job
      description: Canva Get a Design Export Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-exports.getdesignexportjob
      outputParameters:
      - type: object
        mapping: $.
