naftiko: 1.0.0-alpha2
info:
  label: Canva Connect API — Assets
  description: 'Canva Connect API — Assets. 4 operations. Lead operation: Canva Upload an Asset. Self-contained Naftiko capability
    covering one Canva business surface.'
  tags:
  - Canva
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CANVA_API_KEY: CANVA_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-assets
    baseUri: https://api.canva.com/rest/v1
    description: Canva Connect API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: asset-uploads
      path: /asset-uploads
      operations:
      - name: createassetuploadjob
        method: POST
        description: Canva Upload an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Asset-Upload-Metadata
          in: header
          type: string
          description: JSON object containing name_base64, the Base64-encoded asset name (1-50 characters before encoding)
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: asset-uploads-jobId
      path: /asset-uploads/{jobId}
      operations:
      - name: getassetuploadjob
        method: GET
        description: Canva Get Asset Upload Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: assets-assetId
      path: /assets/{assetId}
      operations:
      - name: getasset
        method: GET
        description: Canva Get an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteasset
        method: DELETE
        description: Canva Delete an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CANVA_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-assets-rest
    port: 8080
    description: REST adapter for Canva Connect API — Assets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/asset-uploads
      name: asset-uploads
      description: REST surface for asset-uploads.
      operations:
      - method: POST
        name: createassetuploadjob
        description: Canva Upload an Asset
        call: connect-assets.createassetuploadjob
        with:
          Asset-Upload-Metadata: rest.Asset-Upload-Metadata
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/asset-uploads/{jobid}
      name: asset-uploads-jobid
      description: REST surface for asset-uploads-jobId.
      operations:
      - method: GET
        name: getassetuploadjob
        description: Canva Get Asset Upload Job
        call: connect-assets.getassetuploadjob
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets/{assetid}
      name: assets-assetid
      description: REST surface for assets-assetId.
      operations:
      - method: GET
        name: getasset
        description: Canva Get an Asset
        call: connect-assets.getasset
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteasset
        description: Canva Delete an Asset
        call: connect-assets.deleteasset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Canva Connect API — Assets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: canva-upload-asset
      description: Canva Upload an Asset
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-assets.createassetuploadjob
      with:
        Asset-Upload-Metadata: tools.Asset-Upload-Metadata
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: canva-get-asset-upload-job
      description: Canva Get Asset Upload Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-assets.getassetuploadjob
      outputParameters:
      - type: object
        mapping: $.
    - name: canva-get-asset
      description: Canva Get an Asset
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-assets.getasset
      outputParameters:
      - type: object
        mapping: $.
    - name: canva-delete-asset
      description: Canva Delete an Asset
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: connect-assets.deleteasset
      outputParameters:
      - type: object
        mapping: $.
