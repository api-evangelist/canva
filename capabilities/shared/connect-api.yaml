naftiko: "1.0.0-alpha1"

info:
  label: "Canva Connect API"
  description: "Integrate Canva's design platform into applications with design creation, asset management, exports, autofill, and collaboration."
  tags:
    - Canva
    - Design
    - Graphics
    - Templates
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      CANVA_ACCESS_TOKEN: CANVA_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: connect-api
      baseUri: https://api.canva.com/rest/v1
      description: "Canva Connect API for design management, assets, exports, and collaboration."
      authentication:
        type: bearer
        token: "{{CANVA_ACCESS_TOKEN}}"
      resources:
        - name: designs
          path: /designs
          description: "Create and manage designs."
          operations:
            - name: list-designs
              method: GET
              description: "List designs accessible to the authenticated user."
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: false
                  description: "Search term to filter designs."
                - name: ownership
                  in: query
                  type: string
                  required: false
                  description: "Filter by ownership (any, owned, shared)."
                - name: sort_by
                  in: query
                  type: string
                  required: false
                  description: "Sort field."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-design
              method: POST
              description: "Create a new Canva design."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  design_type: "{{tools.design_type}}"
                  title: "{{tools.title}}"
            - name: get-design
              method: GET
              description: "Get a specific design by ID."
              inputParameters:
                - name: designId
                  in: path
                  type: string
                  required: true
                  description: "Design ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: assets
          path: /assets
          description: "Manage design assets."
          operations:
            - name: get-asset
              method: GET
              description: "Get an asset by ID."
              inputParameters:
                - name: assetId
                  in: path
                  type: string
                  required: true
                  description: "Asset ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-asset
              method: DELETE
              description: "Delete an asset."
              inputParameters:
                - name: assetId
                  in: path
                  type: string
                  required: true
                  description: "Asset ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-asset-upload-job
              method: POST
              description: "Upload an asset."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
            - name: get-asset-upload-job
              method: GET
              description: "Get asset upload job status."
              inputParameters:
                - name: jobId
                  in: path
                  type: string
                  required: true
                  description: "Job ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: folders
          path: /folders
          description: "Manage folders."
          operations:
            - name: get-folder
              method: GET
              description: "Get a folder by ID."
              inputParameters:
                - name: folderId
                  in: path
                  type: string
                  required: true
                  description: "Folder ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-folder-items
              method: GET
              description: "List items in a folder."
              inputParameters:
                - name: folderId
                  in: path
                  type: string
                  required: true
                  description: "Folder ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: move-folder-item
              method: POST
              description: "Move an item to a folder."
              inputParameters:
                - name: folderId
                  in: path
                  type: string
                  required: true
                  description: "Target folder ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: exports
          path: /exports
          description: "Export designs."
          operations:
            - name: create-export-job
              method: POST
              description: "Create a design export job."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  design_id: "{{tools.design_id}}"
                  format: "{{tools.format}}"
            - name: get-export-job
              method: GET
              description: "Get export job status."
              inputParameters:
                - name: exportId
                  in: path
                  type: string
                  required: true
                  description: "Export job ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: comments
          path: /designs/{designId}/comments
          description: "Manage design comments."
          operations:
            - name: create-comment
              method: POST
              description: "Create a comment on a design."
              inputParameters:
                - name: designId
                  in: path
                  type: string
                  required: true
                  description: "Design ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  message: "{{tools.message}}"
            - name: create-reply
              method: POST
              description: "Reply to a comment."
              inputParameters:
                - name: designId
                  in: path
                  type: string
                  required: true
                  description: "Design ID."
                - name: commentId
                  in: path
                  type: string
                  required: true
                  description: "Comment ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  message: "{{tools.message}}"
        - name: users
          path: /users
          description: "User information."
          operations:
            - name: get-users-me
              method: GET
              description: "Get the authenticated user profile."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: brand-templates
          path: /brand-templates
          description: "Access brand templates."
          operations:
            - name: list-brand-templates
              method: GET
              description: "List brand templates."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-brand-template
              method: GET
              description: "Get a brand template by ID."
              inputParameters:
                - name: brandTemplateId
                  in: path
                  type: string
                  required: true
                  description: "Brand template ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-brand-template-dataset
              method: GET
              description: "Get the autofill dataset for a brand template."
              inputParameters:
                - name: brandTemplateId
                  in: path
                  type: string
                  required: true
                  description: "Brand template ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: autofills
          path: /autofills
          description: "Autofill designs from templates."
          operations:
            - name: create-autofill-job
              method: POST
              description: "Create a design autofill job from a brand template."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  brand_template_id: "{{tools.brand_template_id}}"
                  data: "{{tools.data}}"
                  title: "{{tools.title}}"
            - name: get-autofill-job
              method: GET
              description: "Get autofill job status."
              inputParameters:
                - name: jobId
                  in: path
                  type: string
                  required: true
                  description: "Autofill job ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: resizes
          path: /resizes
          description: "Resize designs."
          operations:
            - name: create-resize-job
              method: POST
              description: "Create a design resize job."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  design_id: "{{tools.design_id}}"
                  resize_type: "{{tools.resize_type}}"
            - name: get-resize-job
              method: GET
              description: "Get resize job status."
              inputParameters:
                - name: jobId
                  in: path
                  type: string
                  required: true
                  description: "Resize job ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: connect-rest-api
      resources:
        - path: /v1/designs
          name: designs
          description: "Design management."
          operations:
            - method: GET
              name: list-designs
              description: "List designs."
              call: "connect-api.list-designs"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-design
              description: "Create a design."
              call: "connect-api.create-design"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/assets
          name: assets
          description: "Asset management."
          operations:
            - method: GET
              name: get-asset
              description: "Get an asset."
              call: "connect-api.get-asset"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/exports
          name: exports
          description: "Design exports."
          operations:
            - method: POST
              name: create-export-job
              description: "Create an export job."
              call: "connect-api.create-export-job"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: connect-mcp
      transport: http
      tools:
        - name: list-designs
          description: "List Canva designs accessible to the user."
          hints:
            readOnly: true
            openWorld: true
          call: "connect-api.list-designs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-design
          description: "Create a new Canva design."
          hints:
            readOnly: false
          call: "connect-api.create-design"
          with:
            design_type: "tools.design_type"
            title: "tools.title"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-design
          description: "Get a specific design by ID."
          hints:
            readOnly: true
          call: "connect-api.get-design"
          with:
            designId: "tools.designId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-asset
          description: "Get an asset by ID."
          hints:
            readOnly: true
          call: "connect-api.get-asset"
          with:
            assetId: "tools.assetId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-asset
          description: "Delete an asset."
          hints:
            readOnly: false
            destructive: true
          call: "connect-api.delete-asset"
          with:
            assetId: "tools.assetId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: upload-asset
          description: "Upload an asset to Canva."
          hints:
            readOnly: false
          call: "connect-api.create-asset-upload-job"
          with:
            name: "tools.name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-folder
          description: "Get a folder by ID."
          hints:
            readOnly: true
          call: "connect-api.get-folder"
          with:
            folderId: "tools.folderId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-folder-items
          description: "List items in a folder."
          hints:
            readOnly: true
          call: "connect-api.list-folder-items"
          with:
            folderId: "tools.folderId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-export-job
          description: "Export a design to PDF, PNG, JPG, GIF, PPTX, or MP4."
          hints:
            readOnly: false
          call: "connect-api.create-export-job"
          with:
            design_id: "tools.design_id"
            format: "tools.format"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-export-job
          description: "Get export job status."
          hints:
            readOnly: true
          call: "connect-api.get-export-job"
          with:
            exportId: "tools.exportId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-comment
          description: "Create a comment on a design."
          hints:
            readOnly: false
          call: "connect-api.create-comment"
          with:
            designId: "tools.designId"
            message: "tools.message"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-users-me
          description: "Get the authenticated user profile."
          hints:
            readOnly: true
          call: "connect-api.get-users-me"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-brand-templates
          description: "List available brand templates."
          hints:
            readOnly: true
          call: "connect-api.list-brand-templates"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-brand-template
          description: "Get a brand template by ID."
          hints:
            readOnly: true
          call: "connect-api.get-brand-template"
          with:
            brandTemplateId: "tools.brandTemplateId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-brand-template-dataset
          description: "Get the autofill dataset for a brand template."
          hints:
            readOnly: true
          call: "connect-api.get-brand-template-dataset"
          with:
            brandTemplateId: "tools.brandTemplateId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-autofill-job
          description: "Create a design from a brand template using autofill data."
          hints:
            readOnly: false
          call: "connect-api.create-autofill-job"
          with:
            brand_template_id: "tools.brand_template_id"
            data: "tools.data"
            title: "tools.title"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-autofill-job
          description: "Get autofill job status."
          hints:
            readOnly: true
          call: "connect-api.get-autofill-job"
          with:
            jobId: "tools.jobId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-resize-job
          description: "Resize a design to different dimensions."
          hints:
            readOnly: false
          call: "connect-api.create-resize-job"
          with:
            design_id: "tools.design_id"
            resize_type: "tools.resize_type"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-resize-job
          description: "Get resize job status."
          hints:
            readOnly: true
          call: "connect-api.get-resize-job"
          with:
            jobId: "tools.jobId"
          outputParameters:
            - type: object
              mapping: "$."
