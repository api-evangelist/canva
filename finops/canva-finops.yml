specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Canva
providerId: canva
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Cost Management
  - Design
  - SaaS
description: 'FOCUS-aligned FinOps for Canva: per-seat SaaS subscriptions (Free, Pro, Teams, Enterprise)
  with API access tied to the underlying Canva account; private integrations require Canva Enterprise.'
notes: Canva does not bill the Connect API as a separate SKU. API access is included with a Canva account;
  private/Enterprise integrations are negotiated. Reconcile if Canva publishes a usage-priced API tier.
sources:
  - https://www.canva.com/pricing/
  - https://www.canva.dev/docs/connect/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Canva Pty Ltd
serviceCategory: Design SaaS
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Refund
    - Credit
focusColumns:
  ServiceName: Canva
  ServiceCategory: Design SaaS
  ProviderName: Canva
  PublisherName: Canva Pty Ltd
  InvoiceIssuerName: Canva Pty Ltd
  BillingCurrency: USD
meters:
  - name: seat_subscription
    unit: seat-month
    aggregation: sum
    dimensions:
      - plan
      - team
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - integration
  - name: design_exports
    unit: export
    aggregation: sum
    dimensions:
      - format
  - name: print_orders
    unit: order
    aggregation: sum
    dimensions:
      - product
      - region
principles:
  - name: Visibility
    description: Use the Canva admin console for seat utilization and billing exports; the Connect API
      itself does not emit a usage-cost stream.
  - name: Allocation
    description: Use Canva Teams workspace structure to attribute seat costs to departments; tag Connect
      API integrations with consuming application IDs upstream of Canva.
  - name: Optimization
    description: Right-size paid seats by reviewing inactive users; reuse brand templates and bulk-create
      via Connect API to reduce per-design overhead.
  - name: Accountability
    description: Workspace owners hold the bill; Enterprise contracts add named account management. Review
      seat count quarterly and renegotiate at renewal.
