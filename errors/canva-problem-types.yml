docs: https://www.canva.dev/docs/connect/error-responses/
description: >-
  Canva Connect API error catalog. Canva publishes a single flat error reference of stable,
  machine-readable error codes shared across every endpoint.
format: custom
rfc9457: false
envelope:
  media_type: application/json
  shape:
    code: Stable machine-readable error code. The field to switch on.
    message: Human-readable description of what went wrong.
  example: |
    HTTP 404
    {
      "code": "design_not_found",
      "message": "Design with id 'ABCD' not found"
    }
  note: >-
    NOT RFC 9457. There is no `type` URI, no `title`, no `status` and no
    application/problem+json media type — every error is application/json with a two-field
    body. Handle programmatically on `code`, never on `message`.
status_codes_observed:
  '400': 31
  '401': 9
  '403': 44
  '404': 47
  '413': 1
  '429': 12
  default: 59
problem_types:
  - code: invalid_access_token
    status: 401
    title: Access token is malformed, expired, or invalid
    remediation: >-
      Check the token format and expiry, refresh it, or re-authenticate the user.
      See https://www.canva.dev/docs/connect/authentication/
  - code: revoked_access_token
    status: 401
    title: Access token has been revoked
    remediation: Re-run the authorization code flow to obtain a new token.
  - code: missing_scope
    status: 403
    title: The token does not carry a scope this endpoint requires
    remediation: >-
      Add the missing scope in your integration settings AND request it during
      authorization; Canva scopes are explicit — asset:write does not imply asset:read.
  - code: permission_denied
    status: 403
    title: The user lacks permission for the resource, or has exhausted a trial quota
    remediation: >-
      Notify the user. On premium endpoints this is also the trial-quota exhaustion error and
      carries an upgrade URL in the message.
  - code: user_role_required
    status: 403
    title: The user's role in the team does not permit this operation
    remediation: Ask the user to perform the action with an account holding the required role.
  - code: not_found
    status: 404
    title: The requested resource does not exist or is not accessible
    remediation: Verify the resource ID; it may have been deleted or moved.
  - code: design_not_found
    status: 404
    title: The specified design does not exist or is not accessible
    remediation: Check the design ID and the user's access to the team that owns it.
  - code: folder_not_found
    status: 404
    title: The specified folder does not exist or is not accessible
  - code: asset_not_found
