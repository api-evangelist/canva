notes:
  - >-
    HTTP status codes annotated per code are the status Canva documents or the status the
    OpenAPI attaches to that error where one is stated; codes documented only in the flat
    error-code list carry the conventional status for their class and should be treated as
    indicative. The `code` string is the stable contract, not the status.
  - >-
    The catalog is API-wide, not per-endpoint: the same codes are returned across every
    Connect API operation, which is what makes a single switch on `code` viable.
