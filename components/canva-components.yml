notes:
  - >-
    The App UI Kit is not optional styling — Canva's design guidelines require apps to look
    native to the editor, so the component library is effectively part of the review contract.
  - >-
    Two of the three embeddable surfaces (Canva Button, Print Partnerships SDK) are unpinned
    CDN script includes with no published version. That is the honest finding, not a gap in
    this probe.
