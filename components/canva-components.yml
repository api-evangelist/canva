description: >-
  Client-side and embeddable surfaces Canva publishes — distinct from the Connect API SDKs.
  Canva ships three separate embedding stories: a React component library for building apps
  that run INSIDE the Canva editor (App UI Kit), a drop-in HTML/JS button that opens Canva
  FROM a host site (Canva Button), and a JavaScript SDK for print partners embedding the
  Canva editor into a product flow.
