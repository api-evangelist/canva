aid: canva
name: Canva
description: >-
  Canva is the visual design platform used by hundreds of millions of people, and it exposes
  four distinct developer surfaces: the Connect APIs (a REST API for creating, autofilling,
  exporting, resizing, importing and commenting on designs from another application), the
  Apps SDK (React apps that run inside the Canva editor), the SCIM and Audit Logs APIs for
  enterprise identity and compliance, and the partner-gated Print API. Canva publishes its
  own OpenAPI description, a dated changelog, per-product llms.txt indexes, a hosted MCP
  server and a public set of Agent Skills.
