generated: '2026-10-20'
method: searched
source: https://www.canva.dev/docs/connect/api-requests-responses/, https://www.canva.dev/docs/connect/authentication/, https://www.canva.dev/docs/connect/versions/,
  https://www.canva.dev/docs/connect/error-responses/, https://www.canva.dev/docs/connect/capabilities/
derived_from: openapi/canva-connect-api-openapi.yml
description: Cross-cutting runtime semantics for the Canva Connect APIs — what an agent or SDK needs to know that is true of every endpoint rather
  than of one.
base_url: https://api.canva.com/rest/v1
media_type: application/json
authentication:
  style: OAuth 2.0 authorization code with PKCE; bearer token in the Authorization header
  header: 'Authorization: Bearer {token}'
  token_endpoint: https://api.canva.com/rest/v1/oauth/token
  token_endpoint_auth: HTTP Basic (client_id/client_secret) or client_secret_post
  refresh: supported (refresh_token grant)
  introspection: POST /v1/oauth/introspect
  revocation: POST /v1/oauth/revoke
  oidc: Canva is also an OIDC provider — https://www.canva.com/.well-known/openid-configuration — with openid/profile/email scopes and a userinfo
    endpoint at https://api.canva.com/auth/v1/oidc/userinfo.
  detail: authentication/canva-authentication.yml
  scopes: scopes/canva-scopes.yml
idempotency:
  coverage: partial
  scope:
  - createImageGenerationJob
  mechanism: request header / body token declared in the OpenAPI
  retention: Keys are held for 24 hours from job creation.
  evidence: idempotency_key on 1 of 51 mutating operations
  docs: https://www.canva.dev/docs/apps/rest-apis/reference/generations/create-image-generation-job/
  other_idempotent_by_design:
  - operationId: cancelTeamInvitation
    evidence: 'Admin API OpenAPI description: "Cancelling is idempotent and always succeeds for a team you own, whether or not a pending invitation
      existed."'
  mitigation: 'The long-running operations are structured as ASYNC JOBS instead: the create call returns a job id and the result is fetched by
    polling, so a lost response can be recovered by re-reading the job rather than by re-issuing the create. This narrows, but does not close,
    the duplicate-write window.'
  header: idempotency_key
  verified: derived
pagination:
  style: cursor (continuation token)
  request_params:
  - name: continuation
    in: query
    description: Opaque token returned by the previous page. Omit for the first page.
  - name: limit
    in: query
    description: Page size. Added incrementally per endpoint — list designs (2025-10-20), list folder items (2025-12-02), list brand templates
      (2026-01-05).
  response_field: continuation
  termination: The response omits `continuation` when there are no further pages.
  exceptions:
  - endpoints:
    - getDesignAnalyticsViewers
    params:
    - offset
    note: The analytics preview APIs use an `offset` instead of a continuation token, and overrunning it returns the `offset_too_large` error.
filtering_and_sorting:
  params:
  - query
  - sort_by
  - ownership
  - item_types
  - pin_status
  - start_time
  - end_time
  - timezone
  note: Applied per-endpoint; there is no global filter grammar.
field_expansion:
  supported: false
  note: No expand/fields/include parameter exists. Responses are fixed shapes.
metadata:
  supported: partial
  note: Assets carry a `metadata` property (added 2026-03-02) and uploads pass metadata via the `Asset-Upload-Metadata` request header; imports
    use `Import-Metadata`. There is no general-purpose user-defined metadata bag on designs or folders.
request_id_tracing:
  documented: false
  note: Canva documents no request-id / correlation-id response header. There is no published identifier to quote back to support for a single
    failed call.
versioning:
  scheme: date-based API versions, independent of the /v1 path segment
  current: A single released version; the `v1` in https://api.canva.com/rest/v1/ is an epoch marker, NOT the API version. New date-based versions
    (e.g. 2024-01-31) are minted only when a breaking change ships.
  support_window: Superseded versions are expected to remain supported for at least 6 months before deprecation and removal.
  preview: 'APIs and fields marked Beta/Preview are exempt: breaking changes to them do NOT mint a new version, and public integrations that use
    them fail review.'
  docs: https://www.canva.dev/docs/connect/versions/
  detail: lifecycle/canva-lifecycle.yml
errors:
  envelope:
    code: stable machine-readable error code
    message: human-readable description
  rfc9457: false
  switch_on: code
  detail: errors/canva-problem-types.yml
rate_limit_signaling:
  headers_published: none
  status_on_exhaustion: 429
  error_code: too_many_requests
  retry_after: not documented
  strategy: exponential backoff
  detail: rate-limits/canva-rate-limits.yml
  published_limits: Per operation, per user of the app, per minute — stated on each REST API reference page (57 operations, 10-180 requests per
    minute); MCP tools 10-100 req/min with a 300 req/min per-user default cap.
async_jobs:
  pattern: 'Create-job returns {"job": {"id": "...", "status": "in_progress"}}; poll the matching Get-job endpoint until status becomes `success`
    or `failed`. Successful jobs carry the result inline.'
  polling: exponential backoff, short initial interval, capped maximum
  reference_implementation: https://github.com/canva-sdks/canva-connect-api-starter-kit/blob/main/demos/common/utils/poll.ts
  job_apis:
  - createDesignAutofillJob / getDesignAutofillJob
  - createDesignExportJob / getDesignExportJob
  - createDesignResizeJob / getDesignResizeJob
  - CreateAssetUploadJob / GetAssetUploadJob
  - createUrlAssetUploadJob / getUrlAssetUploadJob
  - createDesignImportJob / getDesignImportJob
  - createUrlImportJob / getUrlImportJob
  - createDesignMergeJob / getDesignMergeJob
capabilities_precheck:
  supported: true
  description: Premium operations declare `x-required-capabilities` in the OpenAPI (e.g. `resize`, `analytics`). A user missing the capability
    gets 403 with a message naming the required capabilities. Integrations should call GET /v1/users/me/capabilities FIRST and adapt the UI rather
    than calling and failing.
  operation: getUserCapabilities
  docs: https://www.canva.dev/docs/connect/capabilities/
  note: This is an unusually explicit plan-gating contract — most providers make the caller discover premium gating from a 403.
trial_quotas:
  status: preview
  description: Free-plan users get a limited lifetime/monthly trial of certain premium operations. Responses carry a `trial_information` object
    with `uses_remaining` and an `upgrade_url`; exhaustion returns 403 permission_denied with the upgrade URL in the message.
webhook_signing:
  operation: getSigningPublicKeys
  path: /v1/connect/keys
  note: Public keys for verifying Canva webhook notification signatures.
  detail: asyncapi/canva-webhooks.yml
reversibility:
  summary: No API operation restores deleted content; deletes through the API move content to the Canva Trash, from which the user can restore
    it in the Canva UI within a stated 30-day window. Admin writes have inverse operations but no stated window.
  surfaces:
  - surface: assets
    write: deleteAsset
    reversal: Restore from Trash in the Canva UI (no API restore operation)
    reversal_operationId: null
    window: Deleted designs stay in Trash for 30 days
    grade: documented
    evidence:
    - https://www.canva.dev/docs/apps/rest-apis/reference/assets/delete-asset/ ("Deleting an item moves it to the trash.")
    - https://www.canva.com/help/deleted-designs/ ("You can restore or delete content within 30 days")
    note: Window is stated on the Canva Help Center, not in the API docs, and the reversal is a UI action, so an agent cannot perform it through
      the API.
  - surface: folders
    write: deleteFolder
    reversal: Restore from Trash in the Canva UI (no API restore operation)
    reversal_operationId: null
    window: Deleted designs stay in Trash for 30 days
    evidence:
    - https://www.canva.dev/docs/apps/rest-apis/reference/folders/delete-folder/ ("Deleting a folder moves the user's content in the folder to
      the Trash and content owned by other users is moved to the top level of the owner's projects.")
    - https://www.canva.com/help/deleted-designs/
    grade: documented
  - surface: designs
    write: createDesign
    reversal: null
    note: '"Blank designs created with this API are automatically deleted if they''re not edited within 7 days. These blank designs bypass the
      user''s Canva trash and are permanently deleted." There is no delete-design operation in the API.'
    evidence:
    - https://www.canva.dev/docs/apps/rest-apis/reference/designs/create-design/
  - surface: admin team invitations
    write: createTeamInvitation
    reversal_operationId: cancelTeamInvitation
    window: null
    grade: documented
    evidence:
    - openapi/canva-admin-api-openapi.yml
  - surface: admin group membership
    write: createGroupMember
    reversal_operationId: deleteGroupMember
    window: null
    grade: documented
    evidence:
    - openapi/canva-admin-api-openapi.yml
  - surface: oauth tokens
    write: exchangeAccessToken
    reversal_operationId: revokeTokens
    window: null
    grade: documented
    evidence:
    - openapi/canva-oauth-api-openapi.yml
  - surface: async jobs (exports, resizes, autofills, imports, generations, merges)
    reversal: null
    note: No cancel operation is published for any async job; the docs read describe no cancellation.
