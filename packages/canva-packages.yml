description: >-
  First-party Canva client libraries. Everything Canva ships for developers is published to
  npm under the @canva scope; there is no first-party Python, Java, .NET, Go, Ruby, PHP or
  Rust client for the Connect APIs. Canva instead publishes an OpenAPI description
  (https://www.canva.dev/sources/connect/api/latest/api.yml) and points developers at
  openapi-generator to produce clients in other languages — a deliberate generate-your-own
  posture recorded here rather than counted as a gap.
  Versions and publish dates below were read from registry.npmjs.org metadata on 2026-08-13.
