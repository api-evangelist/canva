specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Canva
providerId: canva
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Apps
  - Automation
  - Design
  - Templates
  - Rate Limiting
description: Canva does not publish concrete per-second or per-minute rate limit numbers for the Connect
  API or Apps SDK. Standard 429 throttling behavior should be expected; integrations should implement
  exponential backoff and honor any Retry-After response header. Contact Canva developer support for
  documented limits on a specific integration.
notes: No public rate-limit documentation found for the Canva Connect API. Numbers below are placeholders
  pending provider documentation; treat enforcement as opaque and rely on response codes / Retry-After.
sources:
  - https://www.canva.dev/docs/connect/
  - https://www.canva.com/developers/
responseCodes:
  throttled: 429
limits:
  - name: Canva Connect API (per-integration)
    scope: integration
    metric: varies
    limit: see Canva developer support
    notes: Canva has not published per-second or per-minute caps; assume standard throttling applies.
  - name: Canva Apps SDK
    scope: app
    metric: varies
    limit: see Canva developer support
policies:
  - name: Backoff strategy
    description: Implement exponential backoff with jitter on 429 responses; honor Retry-After if present.
  - name: Idempotent retries
    description: Use idempotent request patterns for upload, export, and design-mutation endpoints to
      avoid double-charging on retried requests.
  - name: OAuth token refresh
    description: Connect API uses OAuth 2.0; cache and refresh tokens rather than reauthorizing on every
      request to avoid auth-flow throttling.
maintainers:
