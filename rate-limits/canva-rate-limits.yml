quotas:
- name: Trial quotas
  status: preview
  scope: per-user, per-premium-operation
  description: Free-plan users get a small allowance of certain premium operations — Canva's published example is
    2 resize operations for a user's lifetime. Not a rate limit; a usage cap.
  signal: Successful responses on premium endpoints include trial_information { uses_remaining, upgrade_url }.
  exhaustion:
    status: 403
    code: permission_denied
    body_note: The message carries the upgrade URL.
  docs: https://www.canva.devhttps://www.canva.dev/docs/apps/rest-apis/requests-responses/
- name: Capability gating
  scope: per-user
  description: Not a rate limit either, but the other way a call gets refused for non-technical reasons — the user's
    plan lacks the capability the operation requires.
  status: 403
  precheck: GET /v1/users/me/capabilities
  docs: https://www.canva.devhttps://www.canva.dev/docs/apps/rest-apis/capabilities/
policies:
- name: Backoff strategy
  description: Canva explicitly recommends exponential backoff, both for 429 handling and for polling async job
    endpoints — poll fast enough for good UX, slowly enough to avoid the limit.
  reference_implementation: https://github.com/canva-sdks/canva-connect-api-starter-kit/blob/main/demos/common/utils/poll.ts
- name: Caching
  description: Canva's own troubleshooting guidance for `too_many_requests` is to review request patterns and cache
    responses to reduce call volume.
